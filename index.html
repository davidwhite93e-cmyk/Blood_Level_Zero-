 apparently, is where they've started asking.\n\n<<if $senseTier > 0>>\nWake-Sense hums low under your skin, a warning-before-the-warning: that sedan's engine just changed pitch. They're about to move.\n[[Get clear before they do.->DocksEntry]]\n<<else>>\n[[Get clear while you still can.->DocksEntry]]\n<</if>>\n[[Approach the sedan. See what they know.->DocksHunterEncounter]]\n\n:: DocksHunterEncounter\n<<set $heat to Math.min(100, $heat + 10)>>\n<<set $okaforAwareness to $okaforAwareness + 2>>\n<<set $okaforMet to true>>\nThe window rolls down before you're within ten feet. The woman behind the wheel has the particular stillness of someone who has already decided you're not a person she needs to be polite to. \"Detective Okafor,\" she says, badge held low, almost bored. \"You want to explain why you just walked up to an unmarked car at one in the morning instead of walking the other way like literally everyone else does?\"\n\nHer partner's hand hasn't moved from somewhere below the dash.\n\n<<if $stepTier > 0>>\n[[Let Hollow Step blur their memory of your face and slip away.->HunterEvadeStep]]\n<</if>>\n[[Talk your way out. Ordinary. Boring. Nothing to see.->HunterEvadeTalk]]\n[[Run.->HunterEvadeRun]]\n\n:: HunterEvadeStep\n<<set $heat to Math.max(0, $heat - 20)>>\nYou let the power do what it's built for — not invisibility, just wrongness, a face that slides off memory the second attention moves away from it. Okafor blinks, frowns, says something about how she thought there'd been someone there, and by the time her partner looks up you're three containers away and gaining distance.\n\n<<include \"SystemCheck\">>\n\n[[Keep moving.->DocksEntry]]\n\n:: HunterEvadeTalk\n<<set $heat to Math.max(0, $heat - 8)>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\n<<set $talkedDown to $talkedDown + 1>>\nYou put your hands where she can see them, mumble something about a shortcut and insomnia, and lean hard into looking like exactly the kind of harmless that gets waved off at one in the morning. It mostly works. She lets you go with a look that says she's filing your face away regardless, badge or no badge.\n\n<<include \"SystemCheck\">>\n\n[[Walk away slowly. Don't run.->DocksEntry]]\n\n:: HunterEvadeRun\n<<set $heat to Math.min(100, $heat + 15)>>\n<<set $humanity to Math.max(0, $humanity - 4)>>\n<<set $okaforAwareness to $okaforAwareness + 2>>\nYou run, and your new body does something with speed and container-canyons that a human sprinter simply couldn't, and you lose them inside two blocks. You also just confirmed, in the most physically undeniable way possible, that you are exactly the kind of thing Detective Okafor has been building a file on. She doesn't forget that.\n\n<<include \"SystemCheck\">>\n\n[[Get somewhere dark and still.->TheCityHub]]\n\n:: OkaforInterview\n<<set $okaforAwareness to $okaforAwareness + 1>>\nShe's standing outside the car this time, coat open, hands in her pockets, and she has picked a spot with a wall at her back and forty metres of open concrete in front of her. She watched you come the entire way.\n\n\"Adaeze Okafor,\" she says. \"We've met. I've been doing this nineteen years and I want you to understand that I am not confused about what I'm looking at. I've got eleven victims in four months, all survivors, all anemic, all with the same two marks and the same missing forty minutes.\" She tilts her head. \"Eleven. Not one body. Somebody out here is being careful, and I have spent three weeks trying to decide whether that makes me feel better or worse.\"\n\n<<if $memoryTier > 0>>\nYou can smell the exhaustion on her — three days of it, minimum, the specific sour note of a person running on gas-station coffee and stubbornness.\n<</if>>\n\n<<if $past == \"nurse\">>\nThere's a hospital lanyard clipped inside her coat pocket. Visitor badge. Someone she's been sitting with. You know the colour of that badge; you've handed out four hundred of them.\n<</if>>\n\n[[Tell her something true. Not everything. Something.->OkaforTruth]]\n[[Lie, completely and calmly.->OkaforLie]]\n[[Make her afraid of you. Make it stop being worth it to her.->OkaforThreaten]]\n\n:: OkaforTruth\n<<set $talkedDown to $talkedDown + 1>>\n<<set $okaforAwareness to $okaforAwareness + 1>>\n<<set $heat to Math.max(0, $heat - 6)>>\n<<set $humanity to Math.min(100, $humanity + 3)>>\n\"Eleven survivors,\" you say. \"You said it yourself. Whatever's doing this is choosing that.\"\n\nOkafor goes very still. \"Is it.\"\n\n\"It is.\" You hold her eyes. \"It's not always going to be able to. But it is right now, and it's the only thing it's got that's worth anything.\"\n\nShe doesn't reach for anything. She doesn't call it in. She just looks at you for a long, long moment with an expression you can't fully read — and the terrible thing, the thing you'll turn over for the rest of the week, is that a piece of it is something like relief.\n\n\"Okay,\" she says finally. \"Then here's mine. Number twelve is where the choosing stops being interesting to me. You understand what I'm telling you.\"\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> An investigator has been given a reason to hesitate.<br>Hesitation is not safety. It is only time.</div>\n\n<<include \"SystemCheck\">>\n\n[[Walk away. Slowly.->DocksEntry]]\n\n:: OkaforLie\n<<set $heat to Math.max(0, $heat - 3)>>\n<<set $okaforAwareness to $okaforAwareness + 1>>\nYou give her a version of yourself that is boring in every direction — a name that isn't yours, a night shift that doesn't exist, a route home that would make sense if any of it were true. You are calm and consistent and entirely unmemorable, and you can see her deciding, in real time, to believe about sixty percent of it.\n\n\"Sure,\" she says, in the tone of a woman writing your description down the second you're out of sight. \"Get home safe.\"\n\n<<include \"SystemCheck\">>\n\n[[Go.->DocksEntry]]\n\n:: OkaforThreaten\n<<set $heat to Math.min(100, $heat + 14)>>\n<<set $humanity to Math.max(0, $humanity - 7)>>\n<<set $okaforAwareness to $okaforAwareness + 3>>\n<<set $recklessCount to $recklessCount + 1>>\nYou let her see it. Not much — you don't touch her, you don't even move fast — you just stop performing humanity for about four seconds and let a nineteen-year veteran of Major Crimes look directly at what's actually standing in front of her.\n\nHer hand goes to her sidearm. It stays there. To her enormous credit, her voice barely shakes.\n\n\"Yeah,\" she says quietly. \"Okay. That's — okay.\"\n\nYou leave her standing on the concrete. You have made her afraid, which was the goal, and you have also just converted a careful investigator into a woman who is going to stop being careful, which was not.\n\n<<include \"SystemCheck\">>\n\n[[Leave before you do something worse.->TheCityHub]]\n\n:: HollowEntry\n<<set $visitedHollow to true>>\n<<set $hunger to Math.min(100, $hunger + 4)>>\nAshgrove Hollow announces itself before you're fully inside it: the streetlights get sparser, the cemetery wall runs along one whole side of the road, and the quiet has a pressure to it, like walking into a room where a conversation just stopped. This ground is claimed. You can feel that as a fact in your body, the way you'd feel a hand on your shoulder before you'd see whose it was.\n\n<<if $past == \"nurse\">>\nThe funeral home on the corner took your patients for fourteen years. You have stood in that loading bay at four in the morning more times than you can stand to count, and you never once wondered who else was standing in it.\n<</if>>\n\n<<if $hollowResolved>>\nThe claim-feeling still sits on the back of your neck, but it's settled into something closer to a held truce than a raised hand, at least for tonight.\n[[Move through the Hollow carefully.->HollowKestrelLore]]\n<<if $nightsPassed >= 3 && !$courtSummoned>>\n[[Voss is standing at the cemetery gate, and this time they're waiting for you.->CourtSummons]]\n<</if>>\n<<if $courtTaskDone>>\n[[Go and stand in front of the Provost again.->IlseAudience]]\n<</if>>\n<<else>>\n[[Press further in anyway.->HollowTrespassChoice]]\n<</if>>\n[[This isn't worth it tonight. Turn back.->TheCityHub]]\n\n:: HollowTrespassChoice\nGravestones lean at angles that predate the city grid around them. Somewhere close, you can hear — feel, almost — something that isn't a heartbeat at all, something colder and steadier, like a held note.\n\n<<include \"SystemCheck\">>\n\n[[Keep going toward it.->HollowRivalEncounter]]\n[[This is someone else's ground. Turn back now, while you still can.->HollowRetreat]]\n\n:: HollowRetreat\n<<set $heat to Math.max(0, $heat - 2)>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\nYou turn around before whatever's out among the stones decides you're worth its attention, and the pressure on the back of your neck eases with every step back toward the wall. Not every fight is one you have to have on someone else's ground on your first week undead.\n\n<<include \"SystemCheck\">>\n\n[[Head back to the hub.->TheCityHub]]\n\n:: HollowRivalEncounter\n<<set $hollowResolved to true>>\n<<set $metVoss to true>>\nA figure steps out from between two mausoleums without a sound, which shouldn't be possible on gravel, and definitely shouldn't be possible for someone your senses insist is built like a linebacker. Their eyes catch what little light there is and throw it back wrong.\n\n\"You're standing in the Hollow Court's ground, fledgling,\" they say, almost gently, which is somehow worse than if they'd shouted it. \"Voss. I keep the borders. That's usually a one-time introduction. How you leave here is up to you.\"\n\n[[Back down. Apologize. Leave.->HollowSubmit]]\n[[Try to talk your way to an understanding.->HollowBargain]]\n[[You're not backing down from anyone. Fight.->HollowFight]]\n\n:: HollowSubmit\n<<set $heat to Math.max(0, $heat - 5)>>\n<<set $humanity to Math.max(0, $humanity - 3)>>\n<<set $courtStanding to $courtStanding + 1>>\nYou lower your eyes, mumble something about not knowing the borders, and back away with your hands visible and your pride somewhere on the ground behind you. Voss watches you go without moving, and the shame of it sits worse than you expected — proof that whatever you are now, self-preservation still outranks dignity most nights.\n\n\"Good,\" they say to your back. \"Learnable. The Court prefers learnable.\"\n\n<<include \"SystemCheck\">>\n\n[[Leave the Hollow.->TheCityHub]]\n\n:: HollowBargain\n<<set $heat to Math.min(100, $heat + 5)>>\n<<set $courtStanding to $courtStanding + 2>>\n<<set $talkedDown to $talkedDown + 1>>\n\"I didn't know the ground was claimed,\" you say, which is true, and somehow that lands better than an apology would have. Voss studies you for a long moment — long enough that you can feel your own pulse-that-isn't-a-pulse in your ears — and then, unexpectedly, huffs something like a laugh.\n\n\"Ignorant, not stupid. There's a difference, and it'll keep you alive a little longer than most of your kind manage.\" They step back, motion toward the wall. \"Learn the borders. Don't test them twice.\" A pause. \"And when the Provost asks who you were, I'll tell her you were polite. That's worth more than you currently understand.\"\n\n<<include \"SystemCheck\">>\n\n[[Leave the Hollow, borders noted.->TheCityHub]]\n\n:: HollowFight\n<<set $humanity to Math.max(0, $humanity - 12)>>\n<<set $heat to Math.min(100, $heat + 10)>>\n<<set $recklessCount to $recklessCount + 2>>\n<<set $scars to $scars + 1>>\n<<set $courtStanding to $courtStanding + 1>>\nYou go in swinging, and for about four seconds it even seems to work — until Voss stops toying with you and shows you exactly how much older, stronger, and more patient they actually are. You end up face-down in wet gravel with a knee between your shoulder blades and a voice at your ear informing you, almost bored, that they could end you right now and no one would ever ask a single question about it.\n\nThey let you up anyway. \"Discipline,\" they say, stepping back, \"is what that was supposed to teach you. Don't waste the lesson.\" Something in your body has changed, cold and permanent, learned the hard way.\n\n<<include \"SystemCheck\">>\n\n[[Limp out of the Hollow.->TheCityHub]]\n\n:: HollowKestrelLore\n<<set $humanity to Math.min(100, $humanity + 1)>>\n<<if $metKestrel && $kestrelStanding >= 2>>\nYou think of something Kestrel said and, for once, take the careful path through instead of the direct one — skirting the mausoleums, staying off the gravel where footsteps carry. It works. Nothing stirs. Whatever claims this ground, tonight it doesn't feel the need to remind you.\n\nThere's a grave near the north wall with no name on it, just a date eleven months after another date. You think about Kestrel's childe, and you keep walking, and you don't mention it to them.\n<<else>>\nYou move through as quietly as you can manage, and mostly, tonight, that's enough.\n<</if>>\n\n<<include \"SystemCheck\">>\n\n[[Head back to the hub.->TheCityHub]]\n\n:: CourtSummons\n<<set $courtSummoned to true>>\n<<set $courtStanding to $courtStanding + 1>>\n<<set $metIlse to true>>\nVoss is at the gate with their hands folded, and they fall into step beside you without asking, which is its own kind of answer about whether this is a request.\n\nThe Hollow Court does not meet in a throne room. It meets in the back office of a monument mason's yard, under a bare bulb, surrounded by half-carved headstones waiting on names. There are four of them in the room and only one of them matters: a small, grey-haired woman in a cardigan doing a crossword, who does not look up for a full twenty seconds after you enter.\n\n\"Provost Ilse Corven,\" Voss says.\n\n\"You've been busy,\" Ilse says, still writing. \"Eleven feedings that I know about. A detective with a case number. A block in Midtown you've started walking like you own it.\" She fills in a word. \"Most fledglings your age are either dead or somebody's pet. You are neither, and that's untidy, and untidiness is the only thing in this city I'm actually paid to have opinions about.\"\n\nShe finally looks up. Her eyes are the oldest thing in the room by a margin you can't calculate.\n\n\"So. I have a use for you, or I have a problem. Let's find out which.\"\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Faction contact: <strong>THE HOLLOW COURT</strong>.<br>Standing: $courtStanding. Unaffiliated status is no longer available to you.</div>\n\n<<include \"SystemCheck\">>\n\n[[Ask what the use would be.->CourtTask]]\n[[Tell her you're not for hire.->CourtRefuse]]\n\n:: CourtRefuse\n<<set $courtStanding to Math.max(-3, $courtStanding - 2)>>\n<<set $humanity to Math.min(100, $humanity + 2)>>\n\"I'm not for hire,\" you say. \"Not yours, not anyone's. I didn't ask for any of this and I'm not going to start taking orders about it.\"\n\nIlse's expression doesn't change at all, which is worse than if it had. \"Noted,\" she says, and goes back to the crossword. \"You may go.\"\n\nVoss walks you out. At the gate, quietly, without looking at you: \"That was either the bravest or the stupidest thing I've watched anyone do in that room. She'll respect it. Respect isn't protection. Try to remember the difference before something makes you learn it.\"\n\n<<include \"SystemCheck\">>\n\n[[Leave the Hollow.->TheCityHub]]\n\n:: CourtTask\n<<if $courtTaskDone>>\n\"You've done what I asked,\" Ilse says. \"Don't develop a taste for being useful. It's how the tedious ones end up with jobs.\"\n\n[[Leave it there.->TheCityHub]]\n<<else>>\n\"Two untidy things in my city,\" Ilse says. \"You may remove one of them, and I will consider you a use rather than a problem.\"\n\nShe holds up one finger. \"There is a second fledgling in Midtown. No sire, same as you, considerably less careful. They will be dead or caught inside a month and they will take somebody's territory down with them when they go.\"\n\nA second finger. \"There is a detective with eleven case files and a composite sketch. She is competent, which makes her a schedule rather than a possibility.\"\n\nShe goes back to the crossword. \"Pick. I genuinely don't mind which.\"\n\n[[Take the fledgling. Sable is your problem anyway.->CourtTaskSable]]\n[[Take the detective. Okafor is the bigger threat.->CourtTaskOkafor]]\n[[Ask what happens to whichever one you don't pick.->CourtTaskQuestion]]\n<</if>>\n\n:: CourtTaskQuestion\n<<set $humanity to Math.min(100, $humanity + 2)>>\n<<set $talkedDown to $talkedDown + 1>>\n\"What happens to the one I don't pick?\"\n\nIlse looks up properly for the second time tonight. Something in the set of her mouth suggests the question is not one she's often asked in that room.\n\n\"Voss handles it,\" she says. \"Voss is extremely good and not remotely careful, and the outcomes tend to be permanent.\" She taps the pen twice. \"You're asking whether choosing one saves the other. It does, for a while. That's the entire offer. I'd take it, in your position, and I'd stop asking questions that make it obvious you have something to protect.\"\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Information acquired at cost.<br>The Court now knows you have leverage points.</div>\n\n<<include \"SystemCheck\">>\n\n[[Take the fledgling.->CourtTaskSable]]\n[[Take the detective.->CourtTaskOkafor]]\n\n:: CourtTaskSable\n<<set $courtTaskDone to true>>\n<<set $courtStanding to $courtStanding + 3>>\n<<set $sableStanding to $sableStanding - 2>>\n<<set $metSable to true>>\n<<set $sableResolved to true>>\nYou take the fledgling.\n\nIt takes you two nights to find where Sable dens — a storage unit off the expressway with a bent roller door and a nest of stolen blankets in it, which is such a fledgling thing to do that it hurts to look at. You wait for them to come home at four in the morning and you tell them, flatly, that the Hollow Court has noticed them and that they have until dawn tomorrow to be out of this city.\n\nSable calls you a liar, then a coward, then — when it becomes clear you're neither — goes very quiet and asks where they're supposed to go.\n\nYou don't have an answer. You give them a bus timetable and forty dollars out of a wallet that isn't yours and you watch them decide, in real time, that surviving is worth being humiliated by someone their own age.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Task complete. Court standing: <strong>$courtStanding</strong>.<br>A rival removed without a body. The Court files this as competence. You may file it however you like.</div>\n\n<<include \"SystemCheck\">>\n\n[[Report back.->TheCityHub]]\n\n:: CourtTaskOkafor\n<<set $courtTaskDone to true>>\n<<set $courtStanding to $courtStanding + 3>>\n<<set $okaforAwareness to Math.max(0, $okaforAwareness - 2)>>\n<<set $heat to Math.max(0, $heat - 10)>>\nYou take the detective.\n\nNot the way the Court means it. You spend three nights doing something far more tedious than murder: you make her case fall apart. Two of her eleven survivors recant after a quiet conversation in a hospital corridor. A chain of custody gets a hole in it. An anonymous tip sends Major Crimes forty hours into a dead end involving a man in Rockford who has never met you.\n\nBy the end of it, Okafor has a case that no prosecutor in this state will touch, and she knows exactly why, and she cannot prove a single part of it.\n\nYou did not hurt her. You took nineteen years of somebody's competence and made it worthless, and you're not sure that's better.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Task complete. Court standing: <strong>$courtStanding</strong>.<br>Investigation degraded. Investigator intact. The System notes you had other options.</div>\n\n<<include \"SystemCheck\">>\n\n[[Report back.->TheCityHub]]\n\n:: IlseAudience\n<<set $courtStanding to $courtStanding + 1>>\nIlse has finished the crossword. She's started another one.\n\n\"You're still here,\" she observes. \"Fledglings who do one job for me usually either vanish or start asking for a second. You've done neither, which I'll admit I find restful.\"\n\nShe sets the pen down — the first time you've seen her put it down — and looks at you with something that isn't quite warmth but is adjacent to it.\n\n\"A piece of advice you didn't ask for. Everything in this city that matters is a question of what you'll be holding when the noise starts. Territory. A Court. An old thing on a dock who's decided you're worth the trouble. A mortal who knows.\" She picks the pen back up. \"Some people hold nothing on purpose. That works too, for a certain kind of person, right up until it doesn't.\"\n\n<<include \"SystemCheck\">>\n\n[[Leave the mason's yard.->TheCityHub]]\n\n:: SableFirstMeet\n<<set $metSable to true>>\n<<set $hunger to Math.min(100, $hunger + 2)>>\nYou feel them before you see them — a wrongness in the crowd flow, people parting around something they haven't consciously noticed. Then you see them: maybe nineteen, oversized denim jacket, moving down the far side of the street with the exact jittery over-alertness you remember having about four nights ago.\n\nThey clock you at the same moment. Both of you stop. There is a long, absurd second where two dead things stand on opposite sides of a Midtown street at 2 a.m. and try to work out the etiquette.\n\n\"You're like me,\" they say, too loud, crossing without looking. Up close they're all nerve. \"You're — okay. Okay. Sable. That's what I'm going with, anyway, the other name doesn't really work anymore.\" A brittle laugh. \"Do you know what happened to us? Does anybody know what happened to us?\"\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Second unclaimed instance detected in local territory.<br>Sire: <strong>UNKNOWN</strong>. Designation: <strong>SABLE</strong>.<br>Note: shared origin unconfirmed. Coincidence unlikely.</div>\n\n[[Tell them what little you know.->SableHelp]]\n[[Tell them nothing. They're competition.->SableCold]]\n[[Ask them what they remember about the night it happened.->SableOrigin]]\n\n:: SableHelp\n<<set $sableStanding to $sableStanding + 3>>\n<<set $humanity to Math.min(100, $humanity + 2)>>\nYou tell them. The hunger and how it lies to you about urgency, the way careful feeding costs less than it looks like it costs, the fact that there is at least one very old person on the Docks who will answer questions if you sit still long enough. You tell them about the Hollow Court's borders, which is the part that might actually keep them alive.\n\nSable listens with the total, undefended attention of someone who has spent four nights assuming they were the only one.\n\n\"Okay,\" they say at the end, and their voice does something they clearly hate. \"Okay. Thanks. I've been — it's been a really bad week, actually.\"\n\n<<include \"SystemCheck\">>\n\n[[Stay a while. Neither of you has anywhere to be.->MidtownEntry]]\n\n:: SableCold\n<<set $sableStanding to $sableStanding - 3>>\n<<set $humanity to Math.max(0, $humanity - 3)>>\nYou look at them — at the jacket, at the shake in their hands, at the four days of hunger doing exactly to them what it did to you — and you calculate, quite deliberately, that this block only supports one of you.\n\n\"No,\" you say. \"I don't know anything. Don't follow me.\"\n\nYou leave them standing on the sidewalk. Behind you, you hear them say your non-answer back to themselves, quietly, testing it, the way people do when they're deciding what a thing means about them.\n\n<<include \"SystemCheck\">>\n\n[[Walk away.->MidtownEntry]]\n\n:: SableOrigin\n<<set $sableStanding to $sableStanding + 2>>\n\"What do you remember? About that night.\"\n\nSable's face goes through several things. \"Concrete,\" they say. \"And — this is stupid — a taste like a match. Like someone struck a match in my mouth.\"\n\nThe street noise keeps going. You don't say anything for a second too long.\n\n\"You too,\" they say. It isn't a question. \"You too. So there's someone. There's someone doing this and they just — leave us? What kind of person makes something and leaves it in an alley?\"\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Sire status cross-referenced: <strong>UNKNOWN — CONSISTENT</strong>.<br>Two subjects. Identical initiation signature. The System has no record of who wrote it.</div>\n\nYou don't have an answer. Neither of you does. It's the first time since you woke up that the not-knowing has felt less like your private problem and more like a fact about the world.\n\n<<include \"SystemCheck\">>\n\n[[Tell them what you've learned so far.->SableHelp]]\n[[Leave it there. Some questions get worse with company.->MidtownEntry]]\n\n:: SableConfront\n<<set $sableResolved to true>>\nSable is feeding behind the parking structure when you find them, and they are doing it badly — noisy, panicked, the man's legs kicking against a dumpster loud enough to carry two blocks. They come off him with their eyes wild and blood on their chin and they see you and immediately, transparently, brace for a fight.\n\nThe man is alive. He's crying. Sable is nineteen and starving and has just realized, about one second too late, that they did this within sight of a working camera.\n\n<<if $sableStanding >= 3>>\n\"I know,\" they say, before you can speak. \"I <em>know.</em> I couldn't— it got away from me.\"\n<<else>>\n\"This is my block now,\" they say, and their voice cracks straight through the middle of it.\n<</if>>\n\n[[Help them clean it up. Handle the man, handle the camera, handle it.->SableAlly]]\n[[Put them down hard. This block can't carry two of you.->SableFight]]\n[[Tell them to leave the city tonight, and mean it.->SableWarn]]\n\n:: SableAlly\n<<set $sableStanding to $sableStanding + 4>>\n<<set $humanity to Math.min(100, $humanity + 4)>>\n<<set $heat to Math.max(0, $heat - 6)>>\n<<set $carefulStreak to $carefulStreak + 1>>\n<<set $talkedDown to $talkedDown + 1>>\nYou take the camera first — nine years of knowing where they are, or four nights of learning fast, depending on which of you is telling it — and then you take the man, gently, and sit with him until the shaking stops and he's decided this was a mugging that went strangely and not the other thing.\n\nThen you take Sable by the elbow and walk them six blocks and make them sit on a wall and you talk them down out of the worst of it.\n\n\"You're not going to be able to do this alone,\" you tell them, which is the truest thing you know. \"Neither am I. That's not a weakness in us. That's just the shape of it.\"\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Alliance established: <strong>SABLE</strong>.<br>Two unclaimed instances. One less alone than before.</div>\n\n<<include \"SystemCheck\">>\n\n[[Walk them home.->MidtownEntry]]\n\n:: SableFight\n<<set $sableStanding to $sableStanding - 5>>\n<<set $humanity to Math.max(0, $humanity - 9)>>\n<<set $recklessCount to $recklessCount + 1>>\n<<set $scars to $scars + 1>>\n<<set $heat to Math.min(100, $heat + 8)>>\nYou don't argue. You cross the distance and you put them into the side of the parking structure hard enough to buckle the panel, and when they come back at you — and they do come back, screaming, all fear and no technique — you take the hit and then you finish it.\n\nThey're on the ground. They're not getting up quickly. You could keep going and both of you know it.\n\nYou don't. You stand over another nineteen-year-old with no sire and no idea what they are and you make yourself stop, and you tell yourself the stopping is the part that matters, and Sable looks up at you with an expression you are going to keep seeing for a long time.\n\n\"You're the same as me,\" they say through a mouthful of blood. \"That's the part I don't get. You're the <em>same as me.</em>\"\n\n<<include \"SystemCheck\">>\n\n[[Leave them there.->MidtownEntry]]\n\n:: SableWarn\n<<set $sableStanding to $sableStanding - 1>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\n<<set $talkedDown to $talkedDown + 1>>\n\"Tonight,\" you say. \"Not tomorrow. There's a Court in this city and they have a person whose entire job is what just happened behind that dumpster, and he is very good at it, and you will not see him coming.\"\n\nSable starts to argue on reflex and then stops, because some animal part of them can hear that you aren't threatening them.\n\n\"Where do I go,\" they say.\n\n\"Anywhere with fewer cameras and no Court. Feed small. Count twice.\" You hear whose words those are as you say them. \"Don't be alone if you can help it. That's all I've got.\"\n\nThey go. You don't know if it works. You will genuinely never know, and that turns out to be its own weight to carry.\n\n<<include \"SystemCheck\">>\n\n[[Head back.->MidtownEntry]]\n\n:: JunieCall\n<<set $junieCalled to true>>\nNine missed calls now. You've been letting it buzz itself out in your pocket for two nights, and tonight, standing under a dead streetlight with somebody else's blood still warm in you, you finally look at the screen while it's still ringing.\n\nJUNIE.\n\nYour sister is twenty-six and lives forty minutes across town and has called you nine times, which she has never done in her life, not once, not even the year everything fell apart.\n\n[[Answer it.->JunieAnswer]]\n[[Let it ring out. She's safer not knowing.->JunieIgnore]]\n\n:: JunieAnswer\n<<set $junieBond to $junieBond + 1>>\n<<set $metJunie to true>>\n<<set $humanity to Math.min(100, $humanity + 3)>>\n\"Oh my god.\" Her voice cracks straight open. \"Oh my <em>god</em>, you're — where have you been, they said there was— there was blood in the parking lot at your work, they said—\"\n\nYou close your eyes. Somewhere in the last five nights, somebody filed a missing person report on you and you never once considered that.\n\n<<if $past == \"nurse\">>\n\"They found your badge in the lot, Bee. Your badge and your car and no you.\"\n<<elseif $past == \"cook\">>\n\"Marco called me. He said you never came out after close and your bike's still chained up behind the kitchen.\"\n<<else>>\n\"Your relief showed up at six and you weren't in the booth and the monitors were still running, they said the monitors were still running—\"\n<</if>>\n\n\"I'm okay,\" you say, and the lie is so enormous and so gentle that it makes something in your chest hurt in a way you'd assumed was no longer physically available to you.\n\n\"You are not okay. Where <em>are</em> you.\"\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Prior-life contact re-established: <strong>JUNIE</strong>.<br>Subject is unaware of vessel status. Recommend—<br>[ recommendation field empty ]</div>\n\n<<include \"SystemCheck\">>\n\n[[Agree to meet her.->JunieMeet]]\n[[Tell her you'll call tomorrow, and hang up.->TheCityHub]]\n\n:: JunieIgnore\n<<set $junieBond to Math.max(0, $junieBond - 1)>>\n<<set $humanity to Math.max(0, $humanity - 4)>>\nYou watch it ring. Eleven seconds. Twelve. It goes to voicemail and forty seconds later the notification comes up and you don't open that either.\n\nShe's safer not knowing. You have constructed this reasoning very carefully over two nights and it is, as far as you can tell, completely sound, and it also happens to be the reasoning that requires the least of you.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Contact declined.<br>Humanity anchor: no longer under active load.</div>\n\n<<include \"SystemCheck\">>\n\n[[Put the phone away.->TheCityHub]]\n\n:: JunieMeet\n<<set $metJunie to true>>\n<<set $junieBond to $junieBond + 1>>\nYou pick a diner because diners are bright and public and full of witnesses, which is a sentence you would not have understood the significance of a week ago.\n\nJunie is in the back booth with her hands around a coffee she isn't drinking, and when she sees you she makes a sound and gets up too fast and hugs you, hard, and you stand there with your arms around your sister and every single one of your instincts screaming a completely different set of information at you about the artery under her ear.\n\nShe pulls back. Looks at you properly. You watch her face work through it: the colour of you, the temperature of you, the fact that you haven't taken a breath in the eleven seconds she's been holding on.\n\n\"You're freezing,\" she says slowly. \"You're — why are you so—\"\n\n<<include \"SystemCheck\">>\n\n[[Tell her the truth.->JunieTruth]]\n[[Lie. Something about a fever, a hospital, a long night.->JunieLie]]\n[[Leave. Right now, before the hunger finishes doing the arithmetic.->JunieLeave]]\n\n:: JunieTruth\n<<set $junieBond to $junieBond + 3>>\n<<set $humanity to Math.min(100, $humanity + 6)>>\n<<set $talkedDown to $talkedDown + 1>>\nYou tell her in a diner booth at three in the morning, quietly, while a fry cook scrapes a griddle twenty feet away, and it is the single hardest thing you have done since you woke up in that alley.\n\nShe doesn't believe you. Then she does, all at once, in the specific moment you let her put two fingers against the inside of your wrist and hold them there for a long, silent count of thirty.\n\nJunie sits back. Her eyes are enormous. She is, you realize with something like awe, not screaming.\n\n\"Okay,\" she says. Her voice is a wreck. \"Okay. So.\" She wipes her face with the heel of her hand, hard, once. \"Have you hurt anybody.\"\n\nIt would be so easy to lie about this part.\n\n\"Yes,\" you say.\n\n\"Have you killed anybody.\"\n\n<<if $humanity >= 60>>\n\"No.\" And it's true, and you have never in your life been so grateful for a true thing.\n<<else>>\n\"I don't know,\" you say, and that is the truth, and it is so much worse than either answer would have been.\n<</if>>\n\nJunie is quiet for a while. Then she reaches across the table and takes your cold hand in both of hers and doesn't let go.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Anchor established: <strong>JUNIE</strong>.<br>One person in this city knows what you are and has not run.</div>\n\n<<include \"SystemCheck\">>\n\n[[Stay until the sky starts thinking about it.->TheCityHub]]\n\n:: JunieLie\n<<set $junieBond to $junieBond + 1>>\n<<set $humanity to Math.max(0, $humanity - 2)>>\nYou give her a fever and a bad reaction and a night in an ER you can describe in enough clinical detail that it lands, and you watch your sister decide to believe you because the alternative is a version of the world she has no framework for.\n\n\"You'd tell me,\" she says. \"If something was really wrong. You'd tell me.\"\n\n\"Yeah,\" you say.\n\nShe hugs you again on the sidewalk and tells you to answer your phone, and you stand there and let her, and the whole time some clear cold part of you is noting that you have just successfully learned to lie to the last person alive who would have taken the truth.\n\n<<include \"SystemCheck\">>\n\n[[Watch her cab pull away.->TheCityHub]]\n\n:: JunieLeave\n<<set $junieBond to Math.max(0, $junieBond - 1)>>\n<<set $humanity to Math.max(0, $humanity - 3)>>\n<<set $hunger to Math.min(100, $hunger + 5)>>\n<<set $feedsDeclined to $feedsDeclined + 1>>\nYou are out of the booth and out the door before she finishes the sentence, because the arithmetic had already started and you could feel where it was going.\n\nShe follows you into the parking lot calling your name. You keep walking. You get around the corner of the building and you put your back against the brick and you stay there, entirely still, until the sound of her stops.\n\nYou did the right thing. You are almost certain you did the right thing. It does not feel like anything except abandonment from either side of it.\n\n<<include \"SystemCheck\">>\n\n[[Go. Just go.->TheCityHub]]\n\n:: FrenzyEvent\n<<set $hunger to 15>>\n<<set $humanity to Math.max(0, $humanity - 15)>>\n<<set $heat to Math.min(100, $heat + 25)>>\n<<set $recklessCount to $recklessCount + 1>>\n<<set $carefulStreak to 0>>\n<<set $feedsReckless to $feedsReckless + 1>>\nThere's no decision-making left in you by this point, just need, and the city is a maze of heartbeats and your body picks one and moves before the part of you that might have chosen differently even gets a vote. You come back to yourself minutes later, kneeling over a stranger on wet pavement, mouth and hands red, with absolutely no memory of the choosing.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Frenzy state resolved. Autonomous feeding behavior logged.<br>The System does not judge. The System only records — but the gap where your choice should have been is real, and it doesn't close on its own.</div>\n\n[[Try to understand what just happened to you.->FrenzyAftermath]]\n\n:: FrenzyAftermath\nYou check — hands shaking, mind catching up late to a body that already finished the job — and the stranger is breathing. Ragged, but breathing. That's the only mercy tonight bought you, and you didn't even choose it.\n\nLetting the hunger get this far wasn't a decision so much as the absence of one. Whatever you decide to do about that starts now, walking away from someone else's worst night, carrying a little less of yourself than you had an hour ago.\n\n<<include \"SystemCheck\">>\n\n[[Back to the street. More careful, this time.->TheCityHub]]\n\n:: HunterAmbush\n<<set $okaforAwareness to $okaforAwareness + 2>>\nThey come out of three directions at once, professional about it, no wasted movement — Okafor at the centre, flanked by two others who move like they've done this before and survived it. \"We know what you are,\" she says, not unkindly, which is almost the most unsettling part. \"We know roughly how many people you've fed on this week. Tonight's the night that stops, one way or another.\"\n\n<<if $disciplines.length > 0>>\nEverything you've become since the alley is available to you right now, and none of it is a plan.\n<<else>>\nYou have nothing built up to fall back on — no learned trick, no unnatural speed, no shadow to fold into. Just whatever you can do with a body that's still, functionally, new to you.\n<</if>>\n\n[[Choose how this ends.->HunterAmbushChoice]]\n\n:: HunterAmbushChoice\nA half-second window, no more. Whatever you're going to do about this, you do it now.\n\n<<if $strengthTier > 0>>\n[[Fight your way through — Grave Strength gives you the means to try.->HunterFightStrength]]\n<</if>>\n<<if $stepTier > 0>>\n[[Fold into the dark and vanish — Hollow Step gives you the cover.->HunterFleeStep]]\n<</if>>\n<<if $voiceTier >= 2>>\n[[Talk. Just talk. Hold the whole street still with your voice.->HunterTalkVoice]]\n<</if>>\n[[Fight with nothing but what you've got.->HunterFightRaw]]\n[[Run with nothing but what you've got.->HunterFleeRaw]]\n\n:: HunterFightStrength\n<<set $heat to Math.max(0, $heat - 25)>>\n<<set $humanity to Math.max(0, $humanity - 8)>>\n<<set $scars to $scars + 1>>\nGrave Strength turns a hopeless fight into a survivable one — you break through the flanking pair hard enough to buy yourself a head start, and by the time Okafor's radioing for backup you're three rooftops away. It costs you something to hurt them to get free, and you know it, and you keep running anyway.\n\nOne of them is going to need a surgeon. You heard the sound his shoulder made.\n\n<<include \"SystemCheck\">>\n\n[[Get somewhere they can't follow.->TheCityHub]]\n\n:: HunterFleeStep\n<<set $heat to Math.max(0, $heat - 40)>>\n<<set $carefulStreak to $carefulStreak + 1>>\nYou go still, go quiet, let Hollow Step do the work strength can't — not fighting your way out, just becoming the kind of nothing that professional attention slides right off of. Okafor's team searches a three-block radius and finds an empty alley and a very confused shared sense that they had someone cornered a minute ago.\n\nYou are close enough, at one point, to hear her say \"no, he was <em>right there</em>\" to nobody in particular.\n\n<<include \"SystemCheck\">>\n\n[[Slip away while they're still looking.->TheCityHub]]\n\n:: HunterTalkVoice\n<<set $heat to Math.max(0, $heat - 30)>>\n<<set $talkedDown to $talkedDown + 1>>\n<<set $humanity to Math.min(100, $humanity + 2)>>\n<<set $okaforAwareness to $okaforAwareness + 1>>\nYou don't run and you don't swing. You put your hands out where all three of them can see them and you start talking, low and level and completely without hurry, and the street does something that all four of you will think about later: it holds.\n\nYou tell them the count. Eleven, all living. You tell them you know exactly what you are and that you have been managing it, badly, alone, for a week. You do not ask for anything, which is the part that works.\n\nNobody fires. Nobody moves. Eventually Okafor lowers her weapon about fifteen degrees, which in the circumstances is practically an embrace, and says: \"Walk. Slowly. We are absolutely not done.\"\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Confrontation resolved without violence.<br>This was not supposed to be one of the available outcomes.</div>\n\n<<include \"SystemCheck\">>\n\n[[Walk. Slowly.->TheCityHub]]\n\n:: HunterFightRaw\n<<set $heat to Math.max(0, $heat - 12)>>\n<<set $humanity to Math.max(0, $humanity - 10)>>\n<<set $scars to $scars + 1>>\nIt's not a fight so much as a scramble — you get lucky more than you get skilled, take a hit that should probably have done more damage than it did, and manage to put enough distance and debris between you and them to break line of sight. It's ugly and it's close and it works, barely, and you know without being told that \"barely\" isn't a strategy you get to rely on twice.\n\n<<include \"SystemCheck\">>\n\n[[Keep moving until your legs remember how to stop shaking.->TheCityHub]]\n\n:: HunterFleeRaw\n<<set $heat to Math.max(0, $heat - 15)>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\n<<set $scars to $scars + 1>>\nYou run, plain and simple, no trick to fall back on, just a new body's speed against three people who trained for exactly this. It's closer than it should be — something clips you across the ribs on the way past a fence and you find out, interestingly, that you can keep running on a rib that's doing that.\n\nYou make it, ducking through a gap they don't quite manage to cover in time, and you don't stop until the city noise swallows the sound of pursuit behind you.\n\n<<include \"SystemCheck\">>\n\n[[Don't stop until you're sure.->TheCityHub]]\n\n:: NightReflection\n<<set $turn to 0>>\n<<set $nightsPassed to $nightsPassed + 1>>\n<<set $hunger to Math.min(100, $hunger + 6)>>\nYou find somewhere still to let the night settle, and take stock of what it actually cost you.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM — NIGHTLY SUMMARY ]</strong> &nbsp;Night $nightsPassed<br>Hunger: <strong>$hunger</strong>/100 &nbsp;|&nbsp; Humanity: <strong>$humanity</strong>/100 &nbsp;|&nbsp; Notoriety: <strong>$heat</strong>/100<br>Careful feedings: $feedsCareful &nbsp;|&nbsp; Reckless feedings: $feedsReckless &nbsp;|&nbsp; Refused: $feedsDeclined<br>Powers surfaced: <<if $disciplines.length > 0>><<print $disciplines.join(\", \")>><<else>>none yet<</if>></div>\n\n<<if $humanity >= 70>>\nWhatever you're becoming, some part of you is still choosing it deliberately, still weighing a stranger's life against your own hunger and landing, more often than not, on mercy. That won't get easier. Tonight, at least, it held.\n<<elseif $humanity >= 40>>\nYou're not who you were a week ago, and you're honest enough with yourself, in the quiet after feeding, to know it. The choices are getting easier to make and harder to feel. That's worth noticing before it stops being true.\n<<else>>\nIt's getting harder to remember exactly what you were protecting by staying careful in the first place. The hunger doesn't have to argue with you as hard as it used to. That should probably frighten you more than it does.\n<</if>>\n\n<<if $humanity <= 12>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Humanity anchor: <strong>FAILING</strong>.<br>There is very little left in this vessel that files its own decisions as decisions.</div>\n\n[[Something is coming apart. Let the night take it.->TheLastNight]]\n<<elseif $heat >= 95>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Notoriety: <strong>TERMINAL</strong>.<br>Every system in this city that can look for you is now looking for you.</div>\n\n[[There isn't going to be another quiet night.->TheLastNight]]\n<<elseif $courtStanding >= 8>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Faction standing: <strong>THE HOLLOW COURT — DECISIVE</strong>.<br>You have become a question the Court intends to answer.</div>\n\n[[The Court has sent for you, and this time it isn't an invitation.->TheLastNight]]\n<<elseif $nightsPassed >= 6>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Observation window closing.<br>Multiple tracked threads converging on a single interval.</div>\n\n[[Everything you've set moving arrives tomorrow night.->TheLastNight]]\n<<else>>\nThere's no sire to report to, no coven waiting to judge the tally. Just the city, still out there, still hungry in its own way, waiting to see what you do with tomorrow night.\n\n[[Go back out. It isn't over.->TheCityHub]]\n<</if>>\n\n:: TheLastNight\n<<set $endgame to true>>\n<<set $turn to 0>>\nThe thing nobody tells you about consequences is that they don't arrive one at a time.\n\nThey arrive the way weather arrives — all at once, from several directions, having been visible on the horizon for days to anyone who was looking. You have not been looking. You have been surviving, which is a different activity that feels identical from the inside.\n\nTonight the sky opens.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM — CONVERGENCE ]</strong> &nbsp;Night $nightsPassed<br>Hunger: <strong>$hunger</strong>/100 &nbsp;|&nbsp; Humanity: <strong>$humanity</strong>/100 &nbsp;|&nbsp; Notoriety: <strong>$heat</strong>/100<br>Tracked threads: converging. Observation window: closing.</div>\n\n<<if $okaforAwareness >= 4>>\nOkafor's people have been on your block since sundown. Not hiding it. Two cars and a van and a woman with nineteen years of patience who has finally stopped being interested in building a case.\n<<elseif $okaforAwareness >= 1>>\nThere's an unmarked car three streets over that has been three streets over all night, no matter which three streets you pick.\n<<else>>\nNobody official is looking for you tonight, which after this week feels less like luck and more like something you built.\n<</if>>\n\n<<if $courtStanding >= 5>>\nVoss left a message with a bartender who didn't understand a word of it: <em>the Provost is sitting up.</em> The Hollow Court does not sit up for fledglings.\n<<elseif $metVoss>>\nThe cemetery quarter has gone quiet in a way you have learned to read. The Court is doing something tonight, and it involves you whether or not you attend.\n<</if>>\n\n<<if $metJunie && $junieBond >= 2>>\nAnd Junie has texted you an address and the word <em>please</em>, and has been sitting in a diner booth waiting since eleven.\n<</if>>\n\n<<if $metKestrel && $kestrelStanding >= 5>>\nKestrel found you an hour ago, which they have never done — they wait, they don't seek — and said one sentence before walking off into the container canyons: \"Whatever you're holding when this lands is what you'll be after.\"\n<</if>>\n\n<<if $humanity <= 15>>\nAnd under all of it, quieter and much closer than any of it, the thing you have been slowly becoming has stopped waiting its turn.\n\n[[There is no choice left to make. There hasn't been for a while.->PathBeast]]\n<<else>>\nFive nights ago you woke up in an alley with no sire, no coven, and no idea what you were. You have since become something specific. Tonight is where the city finds out what.\n\n[[Go and meet Okafor. End the hunt, one way or the other.->PathFight]]\n[[Disappear. Let every system that's tracking you lose the thread for good.->PathVanish]]\n<<if $visitedHollow>>\n[[Go to Ashgrove and stand in front of the Hollow Court.->PathCourt]]\n<</if>>\n<<if $metJunie || $metMira>>\n[[Go to the people who still think you're a person.->PathAnchor]]\n<</if>>\n<</if>>\n\n:: PathBeast\nThere is a version of tonight where you make a decision. You can see it, distantly, the way you can see a lit window from a moving train.\n\nThe hunger has stopped negotiating. It stopped somewhere around the third night and you didn't notice because by then it had already started doing your noticing for you. Every choice you've made since has been the hunger's choice wearing your reasoning like a coat, and the reasoning got thinner every time, and tonight it isn't there at all.\n\nYou are aware — dimly, the way you're aware of a room you left an hour ago — that a woman with a badge is calling your name from the mouth of the alley. You are aware that somewhere across the city a phone is ringing out.\n\nYou are aware, mostly, of the sound of blood in other people's necks. It is the loudest thing there has ever been.\n\n[[Let go.->EndingBeast]]\n\n:: EndingBeast [ending]\n<<set $endingRoute to \"beast\">>\nThey will find the alley in the morning and the alley will not tell them very much.\n\nWhat's left of you doesn't den. Doesn't plan. It moves through the city on a logic with exactly one term in it, and by the end of the week the city has learned the shape of that logic well enough to change its own habits around it — bars closing early in three neighbourhoods, a bus route quietly rerouted, a rumour that turns into a warning that turns into the way people simply live now.\n\nDetective Adaeze Okafor closes eleven case files and opens one much larger one, and she never once uses the word she is actually thinking of, because there is no box for it on the form.\n\nKestrel hears about it on the Docks and sits very still for a long time, and then goes back to watching the water, because there is nothing else that can be usefully done, and because they have done this once before.\n\nSomewhere a phone rings out. Junie leaves a nineteenth voicemail. There's nobody left to hear it — not gone, exactly. Just no longer anybody's brother, anybody's sister, anybody's <em>anything</em>. Just appetite, moving.\n\nThe System is still running. It records everything now, and there is no longer anyone inside to read it.\n\n<div class=\"ending-card\"><strong>ENDING — THE BEAST</strong><br>Humanity: <strong>$humanity</strong>/100 &nbsp;|&nbsp; Notoriety: <strong>$heat</strong>/100 &nbsp;|&nbsp; Nights survived: <strong>$nightsPassed</strong><br>You stopped being someone who happens to be a vampire.</div>\n\n:: PathFight\nYou go to meet her, which is the one move nobody involved was expecting, least of all you.\n\nThe lot behind the transit depot at 3 a.m. Okafor gets out of the car alone, which is either enormous professional courage or an enormous professional mistake, and stands there in the sodium light with her hands empty and her team fanned out at forty metres.\n\n\"Okay,\" she says. \"You came. That's — okay. That's something.\"\n\nYou don't tell her it isn't mercy. You came because there is no version of the next month where you keep doing this and she keeps looking and nothing happens, and you have finally, five nights too late, started thinking past tomorrow.\n\nHer radio says something. Her expression changes.\n\n\"They're moving,\" she says, and it isn't a threat, it's almost an apology. \"That wasn't my call.\"\n\n<<if ($strengthTier >= 2 || $vigilTier >= 2 || $stepTier >= 2 || $senseTier >= 2 || $voiceTier >= 2 || $kestrelStanding >= 5) && $heat < 95>>\n[[The lot goes loud. You are, it turns out, ready for this.->EndingOpenRoad]]\n<<else>>\n[[The lot goes loud. You are not ready for this.->EndingDestroyed]]\n<</if>>\n\n:: PathVanish\nYou have been practising this for five nights without knowing that's what you were doing.\n\nEvery careful feeding. Every camera angle you drifted out of. Every witness you talked down instead of silenced, every night you went hungry rather than loud. It all had a shape and the shape was this: a person becoming difficult to have a record of.\n\nTonight you finish the job. You walk out of Midtown at half past two and you do not walk into anywhere.\n\n<<if $stepTier >= 3 && $heat <= 25>>\n[[Let the city lose you.->EndingGhost]]\n<<else>>\n[[Try to let the city lose you.->EndingOpenRoad]]\n<</if>>\n\n:: PathCourt\nThe monument yard is full tonight. Nine of them, maybe ten, standing among half-carved headstones in a silence that has weight to it. Voss is at the door and does not stop you, which tells you this was expected.\n\nIlse Corven is not doing a crossword.\n\n\"There you are,\" she says. \"You've had a busy week and I've had a tedious one, and both of those facts are about to become the same fact.\" She folds her hands. \"Here is where we are. You are unclaimed, competent, notorious, and standing in my yard. Historically that combination resolves in one of three ways, and I have always found it more efficient to simply ask which one you'd prefer.\"\n\nThe room waits.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Court standing: <strong>$courtStanding</strong>. Notoriety: <strong>$heat</strong>/100.<br>Three outcomes available. All of them are binding.</div>\n\n[[Kneel. Take the Court's protection and the Court's leash with it.->CourtKneel]]\n[[Challenge. Take the yard from whoever's holding it.->CourtChallenge]]\n[[Refuse. No Court, no leash, and no protection either.->CourtRefuseFinal]]\n\n:: CourtKneel\nYou kneel on the gravel of a monument mason's yard in front of a small grey-haired woman in a cardigan, and it is the least dramatic thing you have ever done, and it changes everything.\n\n<<if $courtStanding >= 5>>\n[[Ilse puts her hand on the back of your neck.->EndingCourtBound]]\n<<else>>\n[[Ilse looks at you for a long moment, and does not take your hand.->EndingOpenRoad]]\n<</if>>\n\n:: CourtChallenge\n\"The yard,\" you say. \"I'll take the yard.\"\n\nThe silence that follows is the most attentive silence you have ever stood in. Ilse's eyebrows go up perhaps two millimetres. Voss, from the doorway, makes a small sound that might be despair and might be delight.\n\n\"Well,\" says the Provost. \"Voss. If you would.\"\n\n<<if $strengthTier >= 2 && $scars >= 2>>\n[[Voss comes off the doorframe, and you are already moving.->EndingThroneRoom]]\n<<else>>\n[[Voss comes off the doorframe, and you understand immediately that you have made an error.->EndingDestroyed]]\n<</if>>\n\n:: CourtRefuseFinal\n\"No,\" you say. \"Not yours. Not anyone's. I've had five nights of everything in this city deciding what I am, and I'm going to be the one who does that.\"\n\nIlse absorbs this with the mild interest of a woman who has heard it before and buried most of the people who said it.\n\n\"That is your right,\" she says. \"It is also, statistically, a form of suicide. Is there anyone at all who'd speak for you?\"\n\n<<if $kestrelStanding >= 8>>\n[[Someone steps out of the dark at the back of the yard.->EndingKestrelsChilde]]\n<<else>>\n[[The yard is quiet. Nobody speaks.->EndingOpenRoad]]\n<</if>>\n\n:: PathAnchor\nYou go to the diner.\n\nIt is the least strategic decision available to you. Okafor's people are three streets over, the Court is sitting up, and every instinct you have developed in five nights of not dying is screaming that this is the single worst use of the most dangerous night of your life.\n\n<<if $metJunie>>\nJunie is in the back booth with a coffee she isn't drinking, exactly where she said she'd be, and she has been there since eleven.\n<<else>>\nMira is closing up, chairs on tables, radio low, and she doesn't lock the door when she sees you coming.\n<</if>>\n\nYou sit down across from someone who knew you before, and for the length of one conversation you are not managing anything.\n\n<<if $humanity >= 65 && ($junieBond >= 3 || $miraTrust >= 6)>>\n[[Let it be the thing you chose.->EndingAnchor]]\n<<else>>\n[[Try to explain what you've become.->EndingOpenRoad]]\n<</if>>\n\n:: EndingDestroyed [ending]\n<<set $endingRoute to \"destroyed\">>\n<<if $courtStanding > 0 && $strengthTier < 2>>\nVoss is not cruel about it. That's what you'll have time to notice, in the four seconds you have left to notice anything: there's no relish in it, no speech, no lesson. They cross the yard the way a professional crosses a yard, and the Court watches, and it takes less time than the walk over did.\n\n\"Ignorant and stupid, in the end,\" Ilse says, not unkindly, to the room. \"It so often goes that way. Voss, the north wall, if you would. There's space.\"\n\nThere is a grave near the north wall with no name on it and a date eleven months after another date. Tomorrow night there will be a second one beside it, also unnamed, and the mason will carve neither, because the Hollow Court does not memorialize its untidiness.\n<<else>>\nIt is over faster than anything this important should be.\n\nYou have spent five nights learning that your body can do things bodies can't, and you have not spent five nights learning that six professionals with a plan and forty metres of open ground are a different category of problem entirely. The first round takes you off your feet. Nothing after that is a fight; it's just a procedure being completed correctly.\n\nThe last thing you're aware of is Okafor's voice, close, saying something urgent into a radio — and the strange, distant realization that she sounds like a person trying to stop something rather than a person finishing it.\n\nShe will not talk about that night, afterward. Not to the review board, not to her partner, not to the department psychologist she is required to see twice. Nineteen years and eleven survivors and this is the file she keeps in her desk instead of the cabinet.\n<</if>>\n\nThe System runs for another few seconds after there is nothing left to run for. It does not editorialize. It has never editorialized.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Vessel status: <strong>TERMINATED</strong>.<br>Final record closed. No recipient designated.</div>\n\n<div class=\"ending-card\"><strong>ENDING — DESTROYED</strong><br>Notoriety: <strong>$heat</strong>/100 &nbsp;|&nbsp; Nights survived: <strong>$nightsPassed</strong> &nbsp;|&nbsp; Powers surfaced: <strong>$disciplines.length</strong><br>You ran out of night before you ran out of nerve.</div>\n\n:: EndingCourtBound [ending]\n<<set $endingRoute to \"court\">>\nHer hand is cold and dry and it rests on the back of your neck for perhaps three seconds, and the whole room exhales.\n\n\"Right,\" says Ilse Corven, in exactly the tone of a woman ticking a box. \"You're ours. Get up.\"\n\nThat's it. That's the entire ceremony. You had expected — you're not sure. Blood, or Latin, or something with weight to it. Instead you get a small grey-haired woman telling you to get up off the gravel, and a job, and, within a month, an office.\n\nIt is not a bad life, if life is still the word. The Court is old and slow and profoundly boring and it keeps its people alive, which is more than the last five nights managed. Okafor's file goes cold because the Court has been making files go cold since before her grandmother was born. Midtown becomes formally yours, on paper, in a ledger a mason's apprentice keeps in a drawer. You feed on a schedule. You have not frenzied in two years.\n\nYou also do not go to the diner. Not once. There is a rule about prior-life contact and it was explained to you kindly and it is not negotiable, and the first year is the worst, and then it isn't, and that's somehow the part that costs the most.\n\nVoss becomes something close to a friend. Ilse gives you the crossword sometimes, which you eventually understand is the highest honour available.\n\n<<if $metKestrel && $kestrelStanding >= 4>>\nKestrel stops speaking to you. Not dramatically — they simply aren't on the rail any more, any night you go. You understand exactly why. You made the choice anyway, and you'd probably make it again, and you still walk out to the Docks about once a month to check.\n<</if>>\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Affiliation: <strong>THE HOLLOW COURT</strong>.<br>Unclaimed status: revoked. Vessel is protected. Vessel is spoken for.</div>\n\n<div class=\"ending-card\"><strong>ENDING — COURT-BOUND</strong><br>Court standing: <strong>$courtStanding</strong> &nbsp;|&nbsp; Humanity: <strong>$humanity</strong>/100 &nbsp;|&nbsp; Nights survived: <strong>$nightsPassed</strong><br>You traded the open road for a roof, and the roof is real.</div>\n\n:: EndingKestrelsChilde [ending]\n<<set $endingRoute to \"kestrel\">>\n\"I will.\"\n\nKestrel does not raise their voice. They never have. But the yard turns like a single animal, and Voss goes very still by the door, and Ilse Corven sets down her pen for the second time in her acquaintance with you.\n\n\"Kestrel,\" she says. \"You don't speak for people.\"\n\n\"No,\" Kestrel agrees. They come forward through the headstones without hurrying. \"Not since Ana. That was the arrangement I made with myself and I've kept it for sixty years, and I'm breaking it tonight, in your yard, in front of your Court, because this one turned up unclaimed and broadcasting and did not become what unclaimed things become.\" A pause. \"You've been watching them all week same as I have. You know what they didn't do.\"\n\nIlse looks at you for a long moment.\n\n\"Fine,\" she says. \"Sired, retroactively, by declaration. Ridiculous. Get out of my yard, both of you.\"\n\nOutside, on the road along the cemetery wall, neither of you says anything for about four blocks.\n\n\"That was binding,\" Kestrel says eventually. \"You understand that. It means obligations. It means when the Court calls a moot you go and you stand behind me and you say nothing, for about the next forty years.\"\n\n\"Okay.\"\n\n\"It also means,\" they say, and their voice does something you've never heard it do, \"that if anything in this city comes for you, it comes through me first. That part is not a formality.\"\n\nYou walk the rest of the way to the Docks together. They show you how to read the water. It takes four hours and you are terrible at it and they do not once lose patience, and somewhere around dawn you understand that you have not been given a mentor.\n\nYou've been given a family, sixty years after it stopped being available to anyone.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Sire: <strong>KESTREL</strong>.<br>Field populated. This field has been blank since initialization.</div>\n\n<div class=\"ending-card\"><strong>ENDING — KESTREL'S CHILDE</strong><br>Kestrel standing: <strong>$kestrelStanding</strong> &nbsp;|&nbsp; Humanity: <strong>$humanity</strong>/100 &nbsp;|&nbsp; Nights survived: <strong>$nightsPassed</strong><br>You arrived with no sire. You leave with one who chose it.</div>\n\n:: EndingThroneRoom [ending]\n<<set $endingRoute to \"throne\">>\nYou are already moving when Voss comes off the doorframe, and that is the whole difference.\n\nThey are older than you, stronger than you, and better than you, and none of it survives contact with the fact that you have been put down three separate times this week and got up every time and learned something specific from each one. Voss has not lost a fight in ninety years. It shows. It shows in the way they expect the third exchange to end it, and it doesn't, and you watch something like genuine surprise cross their face right before the yard goes over sideways.\n\nIt takes ninety seconds. Nobody in the room breathes, which for most of them is only a formality.\n\nWhen it's done you're standing over Voss in the gravel with your hand around a half-carved headstone you don't remember picking up, and you look at the Provost, and the Provost looks back at you with an expression of profound, weary irritation.\n\n\"Oh, for—\" Ilse Corven sits down on a workbench. \"Fine. <em>Fine.</em> The yard is yours. Ashgrove is yours. I retain the office and the ledger and you will not enjoy the paperwork nearly as much as you enjoyed that.\"\n\n\"That's it?\"\n\n\"What did you imagine, a crown?\" She picks up her pen. \"You took the yard. That's what taking the yard <em>is</em>. Now you have nine people looking at you wondering whether they should try it, and a detective with your composite in her desk, and a territory that has to be held every single night for as long as you last.\" She goes back to the crossword. \"Congratulations. You've won the tedious thing.\"\n\nVoss gets up eventually, jaw wrong, and looks at you for a long moment — and then laughs, once, and offers a hand, and becomes the first person in this city to be genuinely, uncomplicatedly glad about who you turned out to be.\n\nYou hold Ashgrove. You hold Midtown. You are twenty-nine years old and five nights dead and the most dangerous unclaimed thing in this city stopped being unclaimed the moment it became the thing everyone else measures themselves against.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Territory: <strong>ASHGROVE HOLLOW — HELD</strong>.<br>Vessel is no longer tracked as a subject. Vessel is tracked as a condition.</div>\n\n<div class=\"ending-card\"><strong>ENDING — THRONE ROOM</strong><br>Notoriety: <strong>$heat</strong>/100 &nbsp;|&nbsp; Scars taken: <strong>$scars</strong> &nbsp;|&nbsp; Nights survived: <strong>$nightsPassed</strong><br>You didn't hide from the city. You took a piece of it.</div>\n\n:: EndingAnchor [ending]\n<<set $endingRoute to \"anchor\">>\n<<if $metJunie>>\nYou stay in the booth until the sky starts thinking about it, and then you stay a while longer.\n\nJunie does most of the talking. She has clearly been rehearsing — she has a <em>list</em>, on her phone, of questions, and about a third of them are practical (sunlight, mirrors, garlic, all of which she is delighted to be wrong about) and about a third are logistical, and the last third she doesn't read out.\n\nAround four she says: \"So what happens now.\"\n\n\"I don't know,\" you say. \"I've spent five nights not asking that.\"\n\n\"Okay.\" She turns her cup around. \"Then here's my answer. You come here. Tuesdays. That's it, that's the whole plan, you come to this diner on Tuesdays and I see with my own eyes that you're still — \" she gestures at all of you, \"— <em>in</em> there. And if you ever stop being in there, I want you to tell me, and I'll figure out what to do about it, because I am not letting you decide that on your own at four in the morning.\"\n\nIt is the most naive thing anyone has ever said to you and she means every word of it and you are absolutely going to hold on to it with both hands.\n<<else>>\nYou stay until the chairs are on the tables and the radio's off, and Mira sits down across from you with her coat already on and doesn't ask you a single question you can't answer.\n\n\"I'm not going to pretend I understand it,\" she says eventually. \"I've had about a month to get used to something I still don't have a word for.\" She wraps both hands around a cold coffee. \"But you've had eleven chances at me that I know about, and you're sitting in my closed bar at four in the morning not taking a twelfth, and I've decided that's the whole thing. That's the entire measurement.\"\n<</if>>\n\nYou do not stop being what you are. That's the part nobody warns you about — there's no cure in this, no arc back to a pulse, no morning where it turns out to have been survivable in the ordinary way. The hunger is still there. It will be there in ten years.\n\nBut it turns out that a hunger is easier to carry when someone knows you're carrying it. You feed carefully because there is now a specific person who would be disappointed, and it transpires that disappointing a specific person is a far more powerful mechanism than any amount of abstract morality at three in the morning.\n\nOkafor's file goes quiet, because eleven survivors stop becoming twelve.\n\nThe Court leaves you alone, because there is nothing in you they can use.\n\n<<if $metKestrel && $kestrelStanding >= 3>>\nKestrel tells you, on the rail, watching the water: \"That's the harder one. Most of us pick a Court or a corner. Almost nobody picks a person.\" A long pause. \"Ana would have. That's not a criticism.\"\n<</if>>\n\nYou are a monster who goes to a diner on Tuesdays. It is not redemption. It is just a life, held together on purpose, by hand, every single night.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Humanity anchor: <strong>SECURED — EXTERNAL</strong>.<br>Anomaly. The System has no model for a vessel that improves.</div>\n\n<div class=\"ending-card\"><strong>ENDING — THE ANCHOR</strong><br>Humanity: <strong>$humanity</strong>/100 &nbsp;|&nbsp; Refused feedings: <strong>$feedsDeclined</strong> &nbsp;|&nbsp; Nights survived: <strong>$nightsPassed</strong><br>You chose the person over the power, and the person held.</div>\n\n:: EndingGhost [ending]\n<<set $endingRoute to \"ghost\">>\nThere is no dramatic exit. That's the entire craft of it.\n\nYou do not leave the city. You simply stop being a thing the city can hold on to. The apartment lease was never in your name after the second night. The phone went into the river off the Docks pier on the third. The face on Okafor's composite sketch was never quite right to begin with — you made sure of that, deliberately, four separate times, in four separate encounters that all felt at the time like ordinary survival.\n\nBy the sixth night there is nothing to find. Not because it's hidden. Because it isn't there.\n\nDetective Adaeze Okafor works the case for another nine weeks. She is extremely good and it does not matter at all. Every thread she pulls comes out of the fabric clean — witnesses who are certain about everything except the face, camera footage where somebody's clearly present and somehow never quite in frame, eleven survivors whose accounts converge on a description of a feeling rather than a person. Eventually she gets a new caseload. She does not stop thinking about it. She keeps a photograph in her desk of an empty alley for reasons she declines to examine.\n\nThe Hollow Court's ledger has a line in it that says <em>unclaimed, Midtown, careful</em> and then a date and then nothing. Ilse Corven considers the entry for a while and then rules the matter closed, which in her yard means: not our problem, and never was.\n\n<<if $metKestrel>>\nKestrel goes on watching the water. Once, about a year on, they say to nobody in particular, \"Good,\" and go back to it.\n<</if>>\n\n<<if $metJunie>>\nJunie's calls stop being answered around the fifth night. She files another report. She goes to the police station eleven times over the next two years. She never gets an answer, because there isn't one, because the answer would require somebody to exist in a system somewhere and you have very carefully arranged not to.\n\nSometimes — twice a year, maybe — she gets a postcard with no message on it. She keeps every one. She has no idea what they mean and she is completely certain what they mean.\n<</if>>\n\nYou are still here. That's the thing. You're in this city right now, feeding small, counting twice, moving through streets that have no record of you in any ledger, database, case file, or memory that holds its shape for more than an hour.\n\nWhether that's freedom or a very elaborate way of ceasing to exist is a question you have decided not to answer tonight.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Subject not found.<br>Query returned no records. Query returned no records. Query returned no reco—</div>\n\n<div class=\"ending-card\"><strong>ENDING — GHOST</strong><br>Hollow Step: <strong>tier $stepTier</strong> &nbsp;|&nbsp; Notoriety: <strong>$heat</strong>/100 &nbsp;|&nbsp; Nights survived: <strong>$nightsPassed</strong><br>Every system that was tracking you lost the thread. So, nearly, did you.</div>\n\n:: EndingOpenRoad [ending]\n<<set $endingRoute to \"open\">>\nHere's what actually happens: you get through the night.\n\nNot cleanly. Not with a resolution. You get through it the way you've got through the last five — improvising, mostly, using whatever's nearest, discovering somewhere around the fourth hour that you're better at this than you were on Monday and nowhere near as good as you'll need to be by Friday.\n\nNothing is settled. That's not a failure of the night; that's just what the night was.\n\n<<if $heat >= 60>>\nOkafor still has a file. It's thinner than it was and it's still open, and she still drives past the Docks sometimes at the end of a shift for no reason she'd put in writing.\n<<else>>\nOkafor's file goes quiet for a while. Not closed. Quiet.\n<</if>>\n<<if $courtStanding >= 3>>\nThe Hollow Court considers you a known quantity, which is not the same as an ally, and Ilse Corven's ledger has your name in it with no verdict written beside it yet.\n<<elseif $metVoss>>\nThe Court knows your borders and you know theirs, and that arrangement holds for exactly as long as neither side finds it inconvenient.\n<</if>>\n<<if $miraTrust >= 3>>\nMira still pours you a drink you don't touch, and still doesn't ask.\n<</if>>\n<<if $metJunie && $junieBond >= 1>>\nJunie still calls. You still, mostly, answer.\n<</if>>\n<<if $metKestrel && $kestrelStanding >= 3>>\nKestrel is still on the rail, still watching the water, still willing to be sat next to.\n<</if>>\n\nYou didn't become the Court's creature or the city's ghost or the thing in the alley that people reroute buses around. You didn't get taken apart in a monument yard or a parking lot. You went five nights without picking a single lane and the result is that all of them are, technically, still open.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM — SUMMARY ]</strong><br>Hunger: <strong>$hunger</strong>/100 &nbsp;|&nbsp; Humanity: <strong>$humanity</strong>/100 &nbsp;|&nbsp; Notoriety: <strong>$heat</strong>/100<br>Careful: $feedsCareful &nbsp;|&nbsp; Reckless: $feedsReckless &nbsp;|&nbsp; Refused: $feedsDeclined<br>Affiliation: <strong>NONE</strong>. Territory: <<if $midtownClaim >= 2>><strong>MIDTOWN</strong><<else>><strong>NONE</strong><</if>>. Sire: <strong>UNKNOWN</strong>.</div>\n\nSixth night. You start walking. The hunger comes up under your ribs the way it does, patient and enormous and entirely yours to manage, and somewhere across the city somebody is closing a bar and somebody else is running a case file and an old thing is sitting on a rail watching black water.\n\nNone of it is finished. You find, walking, that you don't especially want it to be.\n\n<div class=\"ending-card\"><strong>ENDING — THE OPEN ROAD</strong><br>Humanity: <strong>$humanity</strong>/100 &nbsp;|&nbsp; Notoriety: <strong>$heat</strong>/100 &nbsp;|&nbsp; Nights survived: <strong>$nightsPassed</strong><br>You leaned into nothing, and everything stayed possible.</div>\n\n:: About\n<div class=\"sys-pulse\"><strong>[ SYSTEM — ABOUT ]</strong><br><strong>Blood Level Zero</strong> — a first-person, System-driven vampire sandbox.</div>\n\nWritten as a Twee3 / SugarCube 2 story and compiled to a single standalone HTML file by a small hand-written interpreter. No backend, no account, no network call — everything you're reading is running locally in this page.\n\n''Eight endings'' are reachable depending on how you feed, who you trust, and what you're holding when the last night lands: The Beast, Destroyed, Court-Bound, Kestrel's Childe, The Anchor, Ghost, Throne Room, and The Open Road.\n\n''Content note:'' grounded horror — predatory tension, violence, and its consequences. No sexual content.\n\nThe typefaces are Spectral and JetBrains Mono. Everything else here is CSS.\n\n[[Back to the street.->TheCityHub]]\n";

/* ==== Controller ==== */
(function(){
  var SAVE_KEY = 'blz-save-v1';
  var engine = null;

  var POWERS = [
    { key:'stepTier',     name:'Hollow Step',   max:3 },
    { key:'strengthTier', name:'Grave Strength',max:3 },
    { key:'senseTier',    name:'Wake-Sense',    max:2 },
    { key:'voiceTier',    name:'Still Voice',   max:2 },
    { key:'memoryTier',   name:'Blood Memory',  max:2 },
    { key:'vigilTier',    name:'Cold Vigil',    max:2 }
  ];

  var passageEl  = document.getElementById('passage');
  var choicesEl  = document.getElementById('choices');
  var statusEl   = document.getElementById('statusStrip');
  var discEl     = document.getElementById('disciplinesRow');
  var nightEl    = document.getElementById('nightLabel');
  var restartBtn = document.getElementById('restartBtn');

  /* ---- persistence (best-effort; never let storage break the game) ---- */
  function saveGame(passageName){
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 1,
        passage: passageName,
        state: engine.state
      }));
    } catch (e) { /* private mode, quota, blocked storage — play on */ }
  }
  function loadGame(){
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || data.v !== 1 || !data.passage || !data.state) return null;
      return data;
    } catch (e) { return null; }
  }
  function clearGame(){
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  }

  /* ---- rendering ---- */
  function ticks(value, count){
    var v = Math.max(0, Math.min(100, Number(value) || 0));
    var filled = Math.round((v / 100) * count);
    var html = '';
    for (var i = 0; i < count; i++){
      html += '<span class="' + (i < filled ? 'on' : '') + '"></span>';
    }
    return html;
  }

  function renderStatus(){
    var s = engine.state;
    var gauges = [
      {key:'hunger',   label:'Hunger',    value:s.hunger,   critical: s.hunger >= 85},
      {key:'humanity', label:'Humanity',  value:s.humanity, critical: s.humanity <= 40},
      {key:'heat',     label:'Notoriety', value:s.heat,     critical: s.heat >= 60}
    ];
    statusEl.innerHTML = gauges.map(function(g){
      return '<div class="gauge ' + g.key + (g.critical ? ' critical' : '') + '">' +
        '<div class="gauge-label"><span>' + g.label + '</span><span class="val">' + Math.round(Number(g.value) || 0) + '</span></div>' +
        '<div class="ticks">' + ticks(g.value, 20) + '</div>' +
      '</div>';
    }).join('');

    nightEl.textContent = s.nightsPassed ? ' / night ' + s.nightsPassed : '';

    var tags = POWERS.filter(function(p){ return (Number(s[p.key]) || 0) > 0; }).map(function(p){
      var tier = Number(s[p.key]) || 0;
      var pips = '';
      for (var i = 0; i < p.max; i++){
        pips += i < tier ? '<span>&#9679;</span>' : '<span class="off">&#9679;</span>';
      }
      return '<span class="tag">' + p.name + '<span class="pips">' + pips + '</span></span>';
    });
    discEl.innerHTML = tags.length
      ? tags.join('')
      : '<span style="opacity:.5">no powers surfaced yet</span>';
  }

  function makeChoice(text, target){
    var a = document.createElement('a');
    a.href = '#';
    a.className = 'choice-link';
    a.textContent = text;
    a.dataset.target = target;
    a.addEventListener('click', function(ev){
      ev.preventDefault();
      window.scrollTo({top:0, behavior:'smooth'});
      go(target);
    });
    return a;
  }

  function go(name){
    var result;
    try {
      result = engine.goto(name);
    } catch (e) {
      passageEl.innerHTML = '<p style="color:#c93a4c">A tear in the narrative: ' + (e && e.message ? e.message : e) + '</p>';
      choicesEl.innerHTML = '';
      console.error(e);
      return;
    }

    passageEl.innerHTML = result.html;
    renderStatus();
    choicesEl.innerHTML = '';

    var isEnding = (result.tags || []).indexOf('ending') !== -1;

    if (isEnding) {
      // The run is over — drop the checkpoint so "begin again" is a clean slate.
      clearGame();
      var note = document.createElement('p');
      note.className = 'end-note';
      note.textContent = '— end of run —';
      var actions = document.createElement('div');
      actions.className = 'end-actions';
      var again = document.createElement('a');
      again.href = '#';
      again.className = 'choice-link';
      again.textContent = 'Begin again, from the alley.';
      again.addEventListener('click', function(ev){
        ev.preventDefault();
        window.scrollTo({top:0, behavior:'smooth'});
        startNew();
      });
      actions.appendChild(again);
      choicesEl.appendChild(note);
      choicesEl.appendChild(actions);
      return;
    }

    saveGame(result.passage);

    if (result.choices.length === 0) {
      choicesEl.innerHTML = '<p class="end-note">— no further paths from here —</p>';
      return;
    }

    var row = document.createElement('div');
    row.className = 'choice-row';
    result.choices.forEach(function(c){
      row.appendChild(makeChoice(c.text, c.target));
    });
    choicesEl.appendChild(row);
  }

  function startNew(){
    clearGame();
    engine = BLZCreateEngine(TWEE_SOURCE);
    go(engine.startPassage);
  }

  function resumeFrom(save){
    engine = BLZCreateEngine(TWEE_SOURCE);
    // StoryInit has already seeded defaults; overlay the saved run on top of them
    // so that variables added since the save was written keep their defaults.
    Object.keys(save.state).forEach(function(k){
      engine.state[k] = save.state[k];
    });
    go(save.passage);
  }

  function showResumePrompt(save){
    engine = BLZCreateEngine(TWEE_SOURCE);
    renderStatus();
    passageEl.innerHTML =
      '<div class="resume-panel">' +
        '<h2>[ SYSTEM ] Prior session detected</h2>' +
        '<p>A run is already in progress — night ' + (save.state.nightsPassed || 1) +
        ', humanity ' + Math.round(Number(save.state.humanity) || 0) + '/100. ' +
        'Continue where you left off, or wake up in the alley again?</p>' +
      '</div>';
    choicesEl.innerHTML = '';
    var row = document.createElement('div');
    row.className = 'choice-row';

    var cont = document.createElement('a');
    cont.href = '#';
    cont.className = 'choice-link';
    cont.textContent = 'Continue this run.';
    cont.addEventListener('click', function(ev){ ev.preventDefault(); resumeFrom(save); });

    var fresh = document.createElement('a');
    fresh.href = '#';
    fresh.className = 'choice-link';
    fresh.textContent = 'Start over from the beginning.';
    fresh.addEventListener('click', function(ev){ ev.preventDefault(); startNew(); });

    row.appendChild(cont);
    row.appendChild(fresh);
    choicesEl.appendChild(row);
  }

  restartBtn.addEventListener('click', function(){
    if (window.confirm('Begin the night again from the start? This clears your saved progress.')) {
      startNew();
    }
  });

  var existing = loadGame();
  if (existing) {
    showResumePrompt(existing);
  } else {
    startNew();
  }
})();
</script>
