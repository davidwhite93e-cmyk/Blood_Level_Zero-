<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood Level Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0908;
    --panel:#141210;
    --panel-2:#1b1815;
    --rule:#332723;
    --blood-deep:#5c141f;
    --blood:#9c2233;
    --blood-bright:#c93a4c;
    --system:#8fa39c;
    --system-dim:#5d6d68;
    --bone:#ddd3c4;
    --bone-dim:#9a9086;
    --muted:#6b6259;
    --warn:#c9963a;
    font-size:16px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--bone);
    font-family:'Spectral',Georgia,'Times New Roman',serif;
    font-size:1.05rem;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  @keyframes grain-shift{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-2%,-3%); }
    40%{ transform:translate(-4%,2%); }
    60%{ transform:translate(2%,-2%); }
    80%{ transform:translate(3%,3%); }
  }
  body::before{
    content:"";
    position:fixed; inset:-10%;
    pointer-events:none;
    z-index:1;
    opacity:.05;
    mix-blend-mode:overlay;
    background-image:
      radial-gradient(circle at 20% 30%, #fff 0, transparent 40%),
      radial-gradient(circle at 80% 10%, #fff 0, transparent 35%),
      radial-gradient(circle at 60% 80%, #fff 0, transparent 45%),
      radial-gradient(circle at 10% 90%, #fff 0, transparent 30%);
    background-size:180% 180%;
    animation:grain-shift 9s steps(8) infinite;
  }
  @media (prefers-reduced-motion:reduce){
    body::before{ animation:none; }
  }

  #app{
    position:relative; z-index:2;
    max-width:680px;
    margin:0 auto;
    padding:0 22px 96px;
  }

  /* ---- Masthead ---- */
  .masthead{
    padding:26px 0 14px;
    border-bottom:1px solid var(--rule);
    margin-bottom:0;
  }
  .wordmark{
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--system);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .wordmark .title{ color:var(--bone-dim); }
  .wordmark .dot{ color:var(--blood-bright); }
  .wordmark .night{
    color:var(--muted);
    font-size:.68rem;
    letter-spacing:.14em;
    margin-left:10px;
  }
  .mast-right{ display:flex; align-items:center; gap:8px; }
  .restart-link{
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    letter-spacing:.1em;
    color:var(--muted);
    text-decoration:none;
    text-transform:uppercase;
    border:1px solid var(--rule);
    padding:3px 8px;
    cursor:pointer;
    background:transparent;
    transition:border-color .15s ease, color .15s ease;
  }
  .restart-link:hover{ color:var(--blood-bright); border-color:var(--blood-deep); }
  .restart-link:focus-visible{ outline:2px solid var(--system); outline-offset:2px; }

  /* ---- Status strip ---- */
  .status{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    padding:14px 0 18px;
    border-bottom:1px solid var(--rule);
    margin-bottom:22px;
  }
  .gauge{ display:flex; flex-direction:column; gap:5px; }
  .gauge-label{
    font-family:'JetBrains Mono',monospace;
    font-size:.62rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }
  .gauge-label .val{
    color:var(--bone-dim);
    font-variant-numeric:tabular-nums;
  }
  .ticks{
    display:flex;
    gap:2px;
    height:8px;
  }
  .ticks span{
    flex:1 1 0;
    background:var(--panel-2);
    border-top:1px solid var(--rule);
  }
  .ticks span.on{ background:var(--fill,var(--system)); border-top-color:var(--fill,var(--system)); }
  .gauge.hunger .ticks span.on{ --fill:var(--warn); }
  .gauge.humanity .ticks span.on{ --fill:var(--system); }
  .gauge.heat .ticks span.on{ --fill:var(--blood-bright); }
  .gauge.critical .gauge-label .val{ color:var(--blood-bright); }

  .disciplines-row{
    font-family:'JetBrains Mono',monospace;
    font-size:.66rem;
    letter-spacing:.08em;
    color:var(--system-dim);
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:-6px 0 22px;
    min-height:1em;
  }
  .disciplines-row .tag{
    border:1px solid var(--rule);
    padding:2px 7px;
    color:var(--system);
    text-transform:uppercase;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .disciplines-row .tag .pips{
    color:var(--blood-bright);
    letter-spacing:.12em;
    font-size:.6rem;
  }
  .disciplines-row .tag .pips .off{ color:var(--rule); }

  /* ---- Passage text ---- */
  #passage{ min-height:40vh; }
  #passage p{
    margin:0 0 1.15em;
    color:var(--bone);
  }
  #passage p:first-of-type::first-letter{
    color:var(--blood-bright);
  }
  #passage strong{ color:var(--bone); font-weight:600; }
  #passage em{ color:var(--bone-dim); }

  .sys-pulse{
    font-family:'JetBrains Mono',monospace;
    font-size:.82rem;
    line-height:1.6;
    color:var(--system);
    background:var(--panel);
    border:1px solid var(--rule);
    border-left:3px solid var(--blood);
    padding:12px 14px;
    margin:20px 0;
    letter-spacing:.01em;
    animation:pulse-in .35s ease both;
  }
  .sys-pulse strong{ color:var(--blood-bright); font-weight:700; }
  @keyframes pulse-in{
    from{ opacity:0; transform:translateY(-4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion:reduce){
    .sys-pulse{ animation:none; }
  }

  .ending-card{
    font-family:'JetBrains Mono',monospace;
    font-size:.78rem;
    line-height:1.7;
    color:var(--bone-dim);
    background:linear-gradient(180deg, rgba(92,20,31,.14), rgba(10,9,8,.5));
    border:1px solid var(--blood-deep);
    border-left:4px solid var(--blood-bright);
    padding:16px 18px;
    margin:28px 0 8px;
    letter-spacing:.02em;
  }
  .ending-card strong{ color:var(--blood-bright); letter-spacing:.14em; }

  /* ---- Choices ---- */
  #choices{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:26px;
  }
  .choice-row{ display:contents; }
  a.choice-link{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:.86rem;
    letter-spacing:.01em;
    color:var(--bone);
    text-decoration:none;
    background:var(--panel);
    border:1px solid var(--rule);
    padding:11px 14px;
    transition:border-color .15s ease, background .15s ease, color .15s ease, padding-left .15s ease;
  }
  a.choice-link::before{
    content:"›";
    display:inline-block;
    width:1.1em;
    color:var(--blood);
  }
  a.choice-link:hover{
    border-color:var(--blood-deep);
    background:var(--panel-2);
    color:#fff;
    padding-left:18px;
  }
  a.choice-link:hover::before{ color:var(--blood-bright); }
  a.choice-link:focus-visible{ outline:2px solid var(--system); outline-offset:1px; }

  .end-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:8px;
  }
  .end-note{
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;
    letter-spacing:.06em;
    color:var(--muted);
    text-transform:uppercase;
    margin:0 0 4px;
  }

  .resume-panel{
    border:1px solid var(--rule);
    border-left:3px solid var(--system-dim);
    background:var(--panel);
    padding:16px 18px;
    margin:26px 0 0;
  }
  .resume-panel h2{
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--system);
    margin:0 0 8px;
    font-weight:500;
  }
  .resume-panel p{
    font-size:.95rem;
    color:var(--bone-dim);
    margin:0 0 14px;
  }

  footer.notice{
    font-family:'JetBrains Mono',monospace;
    font-size:.62rem;
    color:var(--muted);
    letter-spacing:.04em;
    margin-top:48px;
    padding-top:16px;
    border-top:1px solid var(--rule);
  }

  ::selection{ background:var(--blood-deep); color:#fff; }
</style>

<div id="app">
  <div class="masthead">
    <div class="wordmark">
      <span class="title">Blood Level Zero<span class="dot">.</span><span class="night" id="nightLabel"></span></span>
      <span class="mast-right">
        <button class="restart-link" id="restartBtn" type="button">↺ begin again</button>
      </span>
    </div>
  </div>

  <div class="status" id="statusStrip" aria-hidden="true"></div>
  <div class="disciplines-row" id="disciplinesRow"></div>

  <main id="passage" aria-live="polite"></main>
  <div id="choices"></div>

  <footer class="notice">SYSTEM ONLINE — TRACKING ACTIVE — SIRE: UNKNOWN — progress saves automatically in this browser</footer>
</div>

<script>
/* ==== Blood Level Zero — embedded engine (SugarCube-subset interpreter) ==== */
// Blood Level Zero — minimal SugarCube-subset Twee interpreter.
// Supports: StoryData/StoryTitle/StoryInit, <<set>>, <<run>>, <<if>>/<<elseif>>/<<else>>/<</if>>,
// <<print>>/<<=>>, <<include "Name">>, naked $var / $var.prop interpolation, [[Text->Target]] links,
// ''bold'' markup, raw HTML passthrough.

function BLZCreateEngine(tweeSource) {
  const passages = parsePassages(tweeSource);
  const state = {};
  let currentPassage = null;

  function parsePassages(src) {
    const result = {};
    // normalize line endings
    src = src.replace(/\r\n/g, '\n');
    const parts = src.split(/^:: /m).slice(1);
    for (const part of parts) {
      const nl = part.indexOf('\n');
      const headerLine = nl === -1 ? part : part.slice(0, nl);
      const body = nl === -1 ? '' : part.slice(nl + 1);
      const m = headerLine.match(/^(.*?)\s*(?:\[(.*)\])?\s*$/);
      const name = (m ? m[1] : headerLine).trim();
      const tags = m && m[2] ? m[2].split(/\s+/).filter(Boolean) : [];
      result[name] = { name, tags, body, ast: null };
    }
    return result;
  }

  function tokenize(body) {
    const tokens = [];
    const re = /<<(.*?)>>|\[\[(.*?)\]\]/gs;
    let last = 0, m;
    while ((m = re.exec(body))) {
      if (m.index > last) tokens.push({ type: 'text', value: body.slice(last, m.index) });
      if (m[1] !== undefined) {
        const raw = m[1].trim();
        const mm = raw.match(/^(\/?[A-Za-z=]+)\s*([\s\S]*)$/);
        const kw = mm ? mm[1] : raw;
        const arg = mm ? mm[2] : '';
        tokens.push({ type: 'macro', kw, arg, raw });
      } else {
        tokens.push({ type: 'link', raw: m[2] });
      }
      last = re.lastIndex;
    }
    if (last < body.length) tokens.push({ type: 'text', value: body.slice(last) });
    return tokens;
  }

  function parseBlock(tokens, pos) {
    const nodes = [];
    while (pos.i < tokens.length) {
      const t = tokens[pos.i];
      if (t.type === 'text') { nodes.push({ type: 'text', value: t.value }); pos.i++; continue; }
      if (t.type === 'link') { nodes.push({ type: 'link', raw: t.raw }); pos.i++; continue; }
      // macro
      if (t.kw === 'if') {
        pos.i++;
        const branches = [{ cond: t.arg, body: parseBlock(tokens, pos) }];
        while (tokens[pos.i] && tokens[pos.i].type === 'macro' && tokens[pos.i].kw === 'elseif') {
          const cond = tokens[pos.i].arg; pos.i++;
          branches.push({ cond, body: parseBlock(tokens, pos) });
        }
        let elseBody = null;
        if (tokens[pos.i] && tokens[pos.i].type === 'macro' && tokens[pos.i].kw === 'else') {
          pos.i++;
          elseBody = parseBlock(tokens, pos);
        }
        if (tokens[pos.i] && tokens[pos.i].type === 'macro' && tokens[pos.i].kw === '/if') {
          pos.i++;
        } else {
          throw new Error('Missing <</if>> closing tag near: ' + JSON.stringify(t));
        }
        nodes.push({ type: 'if', branches, elseBody });
        continue;
      }
      if (t.kw === 'elseif' || t.kw === 'else' || t.kw === '/if') {
        return nodes; // let caller consume the closer
      }
      if (t.kw === 'set') { nodes.push({ type: 'set', arg: t.arg }); pos.i++; continue; }
      if (t.kw === 'run') { nodes.push({ type: 'run', arg: t.arg }); pos.i++; continue; }
      if (t.kw === 'print' || t.kw === '=') { nodes.push({ type: 'print', arg: t.arg }); pos.i++; continue; }
      if (t.kw === 'include') { nodes.push({ type: 'include', arg: t.arg }); pos.i++; continue; }
      // unknown macro: ignore silently
      pos.i++;
    }
    return nodes;
  }

  function ensureAst(p) {
    if (!p.ast) {
      const toks = tokenize(p.body);
      p.ast = parseBlock(toks, { i: 0 });
    }
    return p.ast;
  }

  function subst(expr) {
    return expr
      .replace(/\$([A-Za-z_][A-Za-z0-9_]*)/g, 'state.$1')
      .replace(/(^|[^A-Za-z0-9_$.])_([A-Za-z_][A-Za-z0-9_]*)/g, (m, pre, id) => pre + 'temp.' + id);
  }

  function evalExpr(expr) {
    const code = subst(expr);
    try {
      // eslint-disable-next-line no-new-func
      const fn = new Function('state', 'temp', 'Math', 'return (' + code + ')');
      return fn(state, {}, Math);
    } catch (e) {
      throw new Error('Expression error in "' + expr + '" (compiled: ' + code + '): ' + e.message);
    }
  }

  function execStmt(arg, isSet) {
    if (isSet) {
      const m = arg.match(/^\$([A-Za-z_][A-Za-z0-9_]*)\s+to\s+([\s\S]+)$/);
      if (!m) throw new Error('Malformed <<set>>: ' + arg);
      const varName = m[1];
      const value = evalExpr(m[2]);
      state[varName] = value;
    } else {
      const code = subst(arg);
      try {
        // eslint-disable-next-line no-new-func
        const fn = new Function('state', 'temp', 'Math', code);
        fn(state, {}, Math);
      } catch (e) {
        throw new Error('Statement error in "' + arg + '" (compiled: ' + code + '): ' + e.message);
      }
    }
  }

  function interpolateText(text) {
    // naked $var / $var.prop.prop interpolation (no calls/brackets)
    let out = text.replace(/\$([A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)/g, (m, path) => {
      try {
        const val = evalExpr('$' + path);
        return val === undefined ? '' : String(val);
      } catch (e) {
        return m;
      }
    });
    // ''bold'' markup -> <strong>
    out = out.replace(/''(.+?)''/g, '<strong>$1</strong>');
    return out;
  }

  function renderLink(raw) {
    let text, target;
    if (raw.includes('->')) {
      const idx = raw.indexOf('->');
      text = raw.slice(0, idx).trim();
      target = raw.slice(idx + 2).trim();
    } else if (raw.includes('<-')) {
      const idx = raw.indexOf('<-');
      target = raw.slice(0, idx).trim();
      text = raw.slice(idx + 2).trim();
    } else {
      text = raw.trim();
      target = raw.trim();
    }
    return '<a href="#" class="choice-link" data-target="' + target.replace(/"/g, '&quot;') + '">' + text + '</a>';
  }

  function render(nodes) {
    let out = '';
    for (const n of nodes) {
      if (n.type === 'text') {
        out += interpolateText(n.value);
      } else if (n.type === 'link') {
        out += renderLink(n.raw);
      } else if (n.type === 'if') {
        let done = false;
        for (const br of n.branches) {
          if (!done && evalExpr(br.cond)) { out += render(br.body); done = true; }
        }
        if (!done && n.elseBody) out += render(n.elseBody);
      } else if (n.type === 'set') {
        execStmt(n.arg, true);
      } else if (n.type === 'run') {
        execStmt(n.arg, false);
      } else if (n.type === 'print') {
        out += String(evalExpr(n.arg));
      } else if (n.type === 'include') {
        const name = n.arg.trim().replace(/^"|"$/g, '');
        const p = passages[name];
        if (p) { ensureAst(p); out += render(p.ast); }
      }
    }
    return out;
  }

  function formatOutput(html) {
    const lines = html.split('\n');
    let out = '';
    let paraBuf = [];
    function flushPara() {
      if (paraBuf.length) {
        out += '<p>' + paraBuf.join(' ') + '</p>';
        paraBuf = [];
      }
    }
    for (const raw of lines) {
      const line = raw.trim();
      if (line === '') { flushPara(); continue; }
      if (/^<div/.test(line)) { flushPara(); out += line; continue; }
      if (/^(<a href="#" class="choice-link"[^>]*>.*?<\/a>\s*)+$/.test(line)) {
        // Choice links are surfaced separately via getChoices()/result.choices —
        // the caller renders them as interactive buttons, so omit them from the
        // narrative HTML to avoid a second, non-interactive copy.
        flushPara();
        continue;
      }
      paraBuf.push(line);
    }
    flushPara();
    return out;
  }

  function getChoices(html) {
    const choices = [];
    const re = /<a href="#" class="choice-link" data-target="([^"]*)">(.*?)<\/a>/g;
    let m;
    while ((m = re.exec(html))) {
      choices.push({ target: m[1].replace(/&quot;/g, '"'), text: m[2] });
    }
    return choices;
  }

  // --- init ---
  if (passages['StoryInit']) {
    ensureAst(passages['StoryInit']);
    render(passages['StoryInit'].ast); // executes <<set>> side effects, discards text output
  }

  let startPassage = 'Awakening';
  if (passages['StoryData']) {
    try { startPassage = JSON.parse(passages['StoryData'].body).start || startPassage; } catch (e) { /* ignore */ }
  }

  return {
    passageNames: Object.keys(passages).filter(n => !['StoryData', 'StoryTitle', 'Styles', 'StoryInit', 'SystemCheck'].includes(n)),
    startPassage,
    state,
    goto(name) {
      const p = passages[name];
      if (!p) throw new Error('Unknown passage: ' + name);
      currentPassage = name;
      ensureAst(p);
      const raw = render(p.ast);
      const formatted = formatOutput(raw);
      return { html: formatted, choices: getChoices(raw), passage: name, tags: p.tags.slice() };
    },
    current() { return currentPassage; }
  };
}

if (typeof module !== 'undefined') module.exports = { BLZCreateEngine };


/* ==== Story source (identical to src/story.twee) ==== */
const TWEE_SOURCE = ":: StoryData\n{\n  \"ifid\": \"AC5FB15F-7DE0-4294-AE21-DC1499CD5FF6\",\n  \"format\": \"SugarCube\",\n  \"format-version\": \"2.37.3\",\n  \"start\": \"Awakening\",\n  \"tag-colors\": {\n    \"StoryInit\": \"gray\",\n    \"stylesheet\": \"gray\",\n    \"ending\": \"red\"\n  },\n  \"zoom\": 0.25\n}\n\n:: StoryTitle\nBlood Level Zero\n\n:: Styles [stylesheet]\nbody { background: #0b0a0d; color: #d8d0d2; font-family: Georgia, 'Times New Roman', serif; }\n#story { max-width: 720px; margin: 0 auto; }\n.sys-pulse { border: 1px solid #7a1f2b; background: rgba(122,31,43,0.12); color: #e7c8cc;\n  padding: 10px 14px; margin: 14px 0; font-family: 'Courier New', monospace; font-size: 0.9em;\n  letter-spacing: 0.02em; }\n.sys-pulse strong { color: #ff4d5e; }\n.ending-card { border: 1px solid #7a1f2b; border-left: 4px solid #ff4d5e; background: rgba(10,9,8,0.6);\n  padding: 16px 18px; margin: 18px 0; font-family: 'Courier New', monospace; font-size: 0.9em; }\n.ending-card strong { color: #ff4d5e; letter-spacing: 0.12em; }\na.link-internal, a.macro-link { color: #c94b5a; }\na.link-internal:hover, a.macro-link:hover { color: #ff8a95; }\nhr { border-color: #3a1418; }\n\n:: StoryInit\n<<set $hunger to 78>>\n<<set $humanity to 82>>\n<<set $heat to 6>>\n<<set $disciplines to []>>\n<<set $stepTier to 0>>\n<<set $strengthTier to 0>>\n<<set $senseTier to 0>>\n<<set $voiceTier to 0>>\n<<set $memoryTier to 0>>\n<<set $vigilTier to 0>>\n<<set $carefulStreak to 0>>\n<<set $recklessCount to 0>>\n<<set $feedsCareful to 0>>\n<<set $feedsReckless to 0>>\n<<set $feedsDeclined to 0>>\n<<set $scars to 0>>\n<<set $talkedDown to 0>>\n<<set $kestrelStanding to 0>>\n<<set $miraTrust to 0>>\n<<set $okaforAwareness to 0>>\n<<set $courtStanding to 0>>\n<<set $junieBond to 0>>\n<<set $sableStanding to 0>>\n<<set $midtownClaim to 0>>\n<<set $turn to 0>>\n<<set $nightsPassed to 1>>\n<<set $past to \"\">>\n<<set $pastName to \"\">>\n<<set $visitedMidtown to false>>\n<<set $visitedDocks to false>>\n<<set $visitedHollow to false>>\n<<set $metMira to false>>\n<<set $metKestrel to false>>\n<<set $metSable to false>>\n<<set $metJunie to false>>\n<<set $metVoss to false>>\n<<set $metIlse to false>>\n<<set $hollowResolved to false>>\n<<set $courtSummoned to false>>\n<<set $courtTaskDone to false>>\n<<set $okaforMet to false>>\n<<set $junieCalled to false>>\n<<set $sableResolved to false>>\n<<set $warnHunger to false>>\n<<set $warnHeat to false>>\n<<set $warnHumanity to false>>\n<<set $tutorialDone to false>>\n<<set $endgame to false>>\n<<set $endingRoute to \"\">>\n\n:: SystemCheck\n<<if $hunger >= 85 && !$warnHunger>>\n<<set $warnHunger to true>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Hunger critical.<br>Control is a resource. You are spending it fast.</div>\n<</if>>\n<<if $hunger < 60 && $warnHunger>>\n<<set $warnHunger to false>>\n<</if>>\n<<if $heat >= 60 && !$warnHeat>>\n<<set $warnHeat to true>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Notoriety rising.<br>Something in this city has started paying attention to you.</div>\n<</if>>\n<<if $heat < 40 && $warnHeat>>\n<<set $warnHeat to false>>\n<</if>>\n<<if $humanity <= 40 && !$warnHumanity>>\n<<set $warnHumanity to true>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Humanity anchor weakening.<br>The distance between you and what you used to be is growing.</div>\n<</if>>\n<<if $humanity > 55 && $warnHumanity>>\n<<set $warnHumanity to false>>\n<</if>>\n<<if $stepTier == 0 && $carefulStreak >= 3>>\n<<set $stepTier to 1>>\n<<run $disciplines.push(\"Hollow Step\")>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Power surfaced: <strong>Hollow Step</strong> — I<br>Three careful feedings, three clean exits. You have learned how to be the thing attention slides off of. Rooms forget the shape of you a half-second after you leave them.</div>\n<</if>>\n<<if $stepTier == 1 && $feedsCareful >= 6 && $heat <= 45>>\n<<set $stepTier to 2>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> <strong>Hollow Step</strong> deepened — II<br>Not invisibility. Something worse for the people looking: you are now genuinely difficult to have seen. Pursuit loses the thread.</div>\n<</if>>\n<<if $stepTier == 2 && $feedsCareful >= 8 && $heat <= 25 && $nightsPassed >= 3>>\n<<set $stepTier to 3>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> <strong>Hollow Step</strong> mastered — III<br>You have kept your footprint smaller than your appetite for long enough that the city has stopped keeping a file. There are systems tracking this city's every camera and case number, and you are no longer in any of them.</div>\n<</if>>\n<<if $strengthTier == 0 && $recklessCount >= 2>>\n<<set $strengthTier to 1>>\n<<run $disciplines.push(\"Grave Strength\")>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Power surfaced: <strong>Grave Strength</strong> — I<br>Violence has taught your body something it will not unlearn. Your grip closes with a weight that has nothing to do with muscle.</div>\n<</if>>\n<<if $strengthTier == 1 && $recklessCount >= 5>>\n<<set $strengthTier to 2>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> <strong>Grave Strength</strong> deepened — II<br>Doors, wrists, the frames of cars. Very little in this city is built to hold you now, and the part of you that notices that has stopped being alarmed by it.</div>\n<</if>>\n<<if $strengthTier == 2 && $scars >= 3>>\n<<set $strengthTier to 3>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> <strong>Grave Strength</strong> mastered — III<br>You have been put down three times and got up three times. Whatever is left in you now is the thing older Kindred are quietly careful around.</div>\n<</if>>\n<<if $senseTier == 0 && $kestrelStanding >= 4>>\n<<set $senseTier to 1>>\n<<run $disciplines.push(\"Wake-Sense\")>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Power surfaced: <strong>Wake-Sense</strong> — I<br>Kestrel's patience has opened something behind your eyes. You feel the shape of a room's intentions a breath before the room commits to them.</div>\n<</if>>\n<<if $senseTier == 1 && $kestrelStanding >= 7>>\n<<set $senseTier to 2>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> <strong>Wake-Sense</strong> deepened — II<br>Not prophecy. Attention. You can read a street the way Kestrel reads water — where the current is going, and what is already waiting downstream of it.</div>\n<</if>>\n<<if $voiceTier == 0 && $talkedDown >= 2>>\n<<set $voiceTier to 1>>\n<<run $disciplines.push(\"Still Voice\")>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Power surfaced: <strong>Still Voice</strong> — I<br>Twice now you have walked out of something that should have ended in blood by talking instead. Your voice has picked up a low steadiness that makes people want, briefly and against their judgment, to hear you out.</div>\n<</if>>\n<<if $voiceTier == 1 && $talkedDown >= 4 && $humanity >= 45>>\n<<set $voiceTier to 2>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> <strong>Still Voice</strong> deepened — II<br>You can hold a room now. Not command it — hold it, the way a hand holds a bird, and the frightening part is how badly people want to stay held.</div>\n<</if>>\n<<if $memoryTier == 0 && $feedsCareful >= 5 && $humanity >= 55>>\n<<set $memoryTier to 1>>\n<<run $disciplines.push(\"Blood Memory\")>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Power surfaced: <strong>Blood Memory</strong> — I<br>You have been careful enough, often enough, to actually taste what you were taking. Blood carries the day it came from. You are starting to be able to read it.</div>\n<</if>>\n<<if $memoryTier == 1 && $feedsCareful >= 9>>\n<<set $memoryTier to 2>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> <strong>Blood Memory</strong> deepened — II<br>Further back than a day now. You can follow a life down its own current — who they feared, who they loved, and, in Kindred blood, whose blood made theirs.</div>\n<</if>>\n<<if $vigilTier == 0 && $scars >= 2>>\n<<set $vigilTier to 1>>\n<<run $disciplines.push(\"Cold Vigil\")>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Power surfaced: <strong>Cold Vigil</strong> — I<br>You have been hurt badly twice and walked away from both. Your body has stopped treating damage as an emergency and started treating it as weather.</div>\n<</if>>\n<<if $vigilTier == 1 && $scars >= 4>>\n<<set $vigilTier to 2>>\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> <strong>Cold Vigil</strong> deepened — II<br>You endure past the point where enduring should have stopped being possible. It is not courage. It is just that the alternative has stopped being available to you.</div>\n<</if>>\n\n:: Awakening\nThe last thing you remember is cold concrete and a taste like a struck match.\n\nNow you're on your back in an alley that smells of rain and motor oil, staring up at a sky with no stars in it, just the orange smear of the city ceiling. Your chest doesn't rise. You check, twice, out of habit. It doesn't rise the third time either.\n\nSomething under your ribs turns over, slow and enormous, like a second heartbeat learning how to want.\n\nText scrawls into being at the bottom of your vision, unbidden, uninvited, precise.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Vessel status: <strong>ACTIVE</strong>.<br>Subject reclassified. Sire: <strong>UNKNOWN</strong>. Coven: <strong>NONE</strong>.<br>Hunger tracking initialized.</div>\n\n[[You sit up.->ChoosePast]]\n\n:: ChoosePast\nYou get as far as your elbows before the alley stops spinning. There's a wallet in your back pocket that you're afraid to open and a phone with a cracked screen and nineteen percent battery, and both of them belong to a person you are increasingly certain you are no longer.\n\nThe text does something new. It hesitates — you'd swear it hesitates — and then rewrites itself.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Reconstructing prior identity...<br>Records fragmentary. Personal history degraded.<br>Confirm last known occupation.</div>\n\nThe question lands in you like a hook, and what comes up on the line is not a word so much as a whole life: the smell of a workplace, the ache of a particular shift, the specific tiredness of the person you were about eleven hours ago.\n\n[[You worked the emergency room. Nights, mostly.->PastNurse]]\n[[You worked a kitchen line. Nights, always.->PastCook]]\n[[You worked security. Nights, by definition.->PastGuard]]\n\n:: PastNurse\n<<set $past to \"nurse\">>\n<<set $pastName to \"ER nurse\">>\n<<set $humanity to Math.min(100, $humanity + 2)>>\nAn emergency room. Fourteen years of them. You know exactly how much blood a body can lose and keep its opinions, exactly where the carotid runs under a stranger's jaw, exactly what the monitor does in the four seconds before somebody's family stops being a family.\n\nYou know, in other words, precisely what you are about to be capable of. There's no ignorance available to you here. Whatever you do tonight, you will understand the anatomy of it.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Prior designation logged: <strong>CLINICAL</strong>.<br>Subject possesses working knowledge of human tolerances. Noted.</div>\n\nYour phone has four missed calls on it. All from JUNIE. Your sister has been calling since about the time you stopped having a pulse.\n\n[[Put the phone away. Deal with it later.->FirstPulse]]\n\n:: PastCook\n<<set $past to \"cook\">>\n<<set $pastName to \"line cook\">>\n<<set $hunger to Math.min(100, $hunger + 2)>>\nA kitchen line. Eleven years of standing in the same square metre of heat, hands scarred pale from a hundred small burns you stopped noticing by year two. You know this city's night shift from the inside — who's still open at three, who drinks after close, which bartenders will let a cook sit at the end of the bar and say nothing for an hour.\n\nYou know how to work through exhaustion and appetite. Whether that's going to help you tonight is an open question.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Prior designation logged: <strong>SERVICE</strong>.<br>Subject acclimatized to sustained physical demand. Noted.</div>\n\nYour phone has four missed calls on it. All from JUNIE. Your sister has been calling since about the time you stopped having a pulse.\n\n[[Put the phone away. Deal with it later.->FirstPulse]]\n\n:: PastGuard\n<<set $past to \"guard\">>\n<<set $pastName to \"night security\">>\n<<set $heat to Math.max(0, $heat - 2)>>\nNight security. Nine years of walking other people's empty buildings at hours when nothing should move. You know cameras — where they sit, where they don't, the four-second sweep and the blind corner every installer leaves without meaning to. You know the specific boredom of watching, and the specific alertness underneath it.\n\nYou spent a decade being the person who notices. Tonight, for the first time, you are the thing worth noticing.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Prior designation logged: <strong>OBSERVATIONAL</strong>.<br>Subject familiar with surveillance patterning. Noted.</div>\n\nYour phone has four missed calls on it. All from JUNIE. Your sister has been calling since about the time you stopped having a pulse.\n\n[[Put the phone away. Deal with it later.->FirstPulse]]\n\n:: FirstPulse\nYou get your feet under you against a dumpster that gives a little too easily, like your grip is stronger than you remember it being. The hunger sharpens the second you're vertical, a wire pulled tight behind your teeth.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Hunger: <strong>$hunger</strong>/100 — Humanity: <strong>$humanity</strong>/100 — Notoriety: <strong>$heat</strong>/100<br>No powers known. No territory claimed. No allies.</div>\n\nNo sire. No coven. No idea what you are beyond the word that keeps surfacing in your skull like a bruise: <em>vampire</em>. Just a body that doesn't need to breathe, a hunger that won't quit, and this — thing — quietly narrating your descent.\n\nDown the alley mouth, the street glows sodium-orange. You can hear a heartbeat from here. Actually — you can hear several. Threaded through traffic noise and a distant train, each one is suddenly, obscenely distinct, like the city just handed you a stethoscope pressed to its whole chest.\n\nOne of them is close. Twenty feet, behind a stack of pallets, sitting down, breathing wet and slow. Drunk, maybe. Alone.\n\n[[Follow the sound.->TutorialAlley]]\n\n:: TutorialAlley\nHe's maybe forty, suit jacket balled under his head as a pillow, an empty bottle standing sentinel by his shoe. There's a laminated work badge clipped to his belt: DENNY R., FACILITIES. He smells like whiskey and, underneath it, like something your new body has already decided is the only thing that matters in the world.\n\nThe hunger doesn't ask permission. It just tells you, very clearly, what would happen if you knelt down and put your mouth against his throat.\n\n<<if $past == \"nurse\">>\nYou find his pulse from four feet away out of pure habit — sixty-two, strong, a little slow from the drink. The number arrives before you can stop it, and with it the exact arithmetic of how much you could take before it became a problem for him.\n<<elseif $past == \"cook\">>\nYou know this man's shift. Facilities, second job probably, the kind of tired that puts you on your back in an alley instead of in a cab. You've been that tired. You were that tired last night.\n<<else>>\nYou clock the camera on the loading dock behind him — dead, lens fogged, the kind nobody's checked in a year. Nine years of noticing where the eyes aren't, and your body has already used it before your conscience gets a vote.\n<</if>>\n\nYou have a choice in how you do this. You can already sense that much.\n\n<<if $tutorialDone>>\n[[Feed carefully, take only what you need.->TutorialFeedCareful]]\n[[Feed hard and fast, take what you want.->TutorialFeedReckless]]\n<<else>>\n[[Feed carefully — slow, controlled, leave him breathing.->TutorialFeedCareful]]\n[[Feed hard and fast — let the hunger drive.->TutorialFeedReckless]]\n[[Fight it. Walk away.->TutorialResist]]\n<</if>>\n\n:: TutorialFeedCareful\n<<set $hunger to Math.max(0, $hunger - 25)>>\n<<set $humanity to Math.min(100, $humanity + 2)>>\n<<set $heat to Math.min(100, $heat + 2)>>\n<<set $carefulStreak to $carefulStreak + 1>>\n<<set $recklessCount to 0>>\n<<set $feedsCareful to $feedsCareful + 1>>\n<<set $tutorialDone to true>>\nYou kneel, tilt his head aside like you've done it a thousand times, and drink in slow, measured pulls. You stop while his heart is still finding its rhythm again, not stuttering. You wipe your mouth. Denny will wake up hungover and unnerved, with two small marks he'll blame on a bug bite, and no memory of you at all.\n\nThe hunger recedes to a dull, manageable ache instead of a scream. That matters. You can think again.\n\n<<include \"SystemCheck\">>\n\n[[Stand up. Look at the city properly for the first time.->TheCityHub]]\n\n:: TutorialFeedReckless\n<<set $hunger to Math.max(0, $hunger - 45)>>\n<<set $humanity to Math.max(0, $humanity - 8)>>\n<<set $heat to Math.min(100, $heat + 15)>>\n<<set $recklessCount to $recklessCount + 1>>\n<<set $carefulStreak to 0>>\n<<set $feedsReckless to $feedsReckless + 1>>\n<<set $tutorialDone to true>>\nYou don't kneel. You fall on him, and something in you that isn't hungry so much as furious takes over for a while. When you come back to yourself his lips are gray and his heartbeat is a thready, terrified flutter against your ear, and you have to force yourself — physically force your own jaw — to stop.\n\nHe lives. Barely. He'll remember a shape, a weight, eyes that weren't right. He'll tell someone. Someone will listen.\n\nThe hunger goes quiet all at once, gorged and satisfied, and the silence of it is almost worse than the noise was.\n\n<<include \"SystemCheck\">>\n\n[[Stand up. Look at the city properly for the first time.->TheCityHub]]\n\n:: TutorialResist\n<<set $hunger to Math.min(100, $hunger + 8)>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\n<<set $feedsDeclined to $feedsDeclined + 1>>\nYou dig your nails into your own palms and make yourself stand, make yourself walk the other way, out toward the street. Whatever you are, you decide, it isn't going to be decided for you on the first night, over a man asleep in an alley with his work badge still clipped on.\n\nIt costs you. The hunger doesn't forgive resistance, it just files it away and gets louder. Your hands are shaking by the time you reach the sidewalk, and the heartbeat behind you in the alley suddenly sounds less like temptation and more like a countdown.\n\nYou make it four blocks. The city does its indifferent thing around you — a bus, a couple arguing outside a chicken shop, someone's dog — and every single one of them has a pulse, and you can hear all of them at once, and the sound is starting to arrange itself into something that isn't sound any more.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Hunger: <strong>$hunger</strong>/100. Restraint logged.<br>Note: restraint is not a substitute for blood. The vessel does not accept it as one.</div>\n\n[[The countdown runs out.->FrenzyTutorial]]\n\n:: FrenzyTutorial\n<<set $hunger to 15>>\n<<set $humanity to Math.max(0, $humanity - 15)>>\n<<set $heat to Math.min(100, $heat + 20)>>\n<<set $recklessCount to $recklessCount + 1>>\n<<set $tutorialDone to true>>\nThe next clear thought you have, you're crouched over Denny and he is not moving and there is a sound coming from you that you don't recognize as anything you've ever made before.\n\nYou don't remember crossing the distance. That's the worst part. There's a gap in you now where a choice should have been.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Frenzy state resolved.<br>Control was not available. The System does not judge. The System only records.</div>\n\nYou leave him where he fell — breathing, you make yourself check, breathing — and walk into the city with blood on your collar and no memory of the ten minutes that just happened to you instead of because of you.\n\n<<include \"SystemCheck\">>\n\n[[Keep walking.->TheCityHub]]\n\n:: TheCityHub\n<<set $turn to $turn + 1>>\n<<if $hunger >= 92>>\nThe hunger has stopped being a feeling and started being the only thing that exists. Your vision has a red rim to it. You are not going to make a good decision about this on your own.\n\n[[Something takes over.->FrenzyEvent]]\n<<elseif $heat >= 90>>\nYou've been made. You feel it before you see them — the wrongness of a car idling too long, a jacket that doesn't fit the weather. Someone has been building a file on you, and tonight they close it.\n\n[[They close in.->HunterAmbush]]\n<<elseif $turn >= 6>>\nThe sky over the east end has started doing the thing you have learned, in less than a week, to be afraid of — not light yet, just a thinning, the black going the colour of old iron.\n\nWhatever else you meant to do tonight, you are out of night to do it in.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Interval closing. Solar exposure risk rising.<br>Remaining activity window: insufficient.</div>\n\n[[Find somewhere dark and let the day happen without you.->NightReflection]]\n<<else>>\n<<if $nightsPassed == 1>>\nThe city goes on not caring about you, which after tonight feels like a small mercy. Streetlight, wet asphalt, a thousand heartbeats you're learning to filter out on purpose so you don't have to hear all of them at once.\n<<elseif $nightsPassed <= 3>>\nNight $nightsPassed. You're learning the rhythm of it — how the city empties in layers, which hours belong to whom, where a person can stand for twenty minutes without becoming a story someone tells later.\n<<else>>\nNight $nightsPassed. You move through the city now like something that lives here, and the ease of that is its own quiet indictment. Six days ago you had a commute.\n<</if>>\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Hunger: <strong>$hunger</strong>/100 &nbsp;|&nbsp; Humanity: <strong>$humanity</strong>/100 &nbsp;|&nbsp; Notoriety: <strong>$heat</strong>/100</div>\n\nThree parts of the city keep pulling at your attention, each for a different reason.\n\n[[Head into Midtown Lights — bars, crowds, easy witnesses.->MidtownEntry]]\n[[Head down to The Docks — rougher, contested, and something's watching there too.->DocksEntry]]\n[[Head toward Ashgrove Hollow — the old cemetery quarter. Claimed ground.->HollowEntry]]\n<<if $nightsPassed >= 2 && !$junieCalled>>\n[[Your phone has been buzzing all night. It's Junie.->JunieCall]]\n<<elseif $metJunie && $nightsPassed >= 3>>\n[[Go see Junie again.->JunieMeet]]\n<</if>>\n<<if $courtSummoned && !$courtTaskDone>>\n[[The Hollow Court is waiting on an answer from you.->CourtTask]]\n<</if>>\n[[Find somewhere quiet to wait out the hours.->Rest]]\n[[Check what you've become so far.->CheckStatus]]\n<<if $turn >= 3>>\n[[Stop here for tonight and take stock.->NightReflection]]\n<</if>>\n<</if>>\n\n:: CheckStatus\n<div class=\"sys-pulse\"><strong>[ SYSTEM — STATUS ]</strong> &nbsp;Night $nightsPassed<br>Hunger: <strong>$hunger</strong>/100 &nbsp;|&nbsp; Humanity: <strong>$humanity</strong>/100 &nbsp;|&nbsp; Notoriety: <strong>$heat</strong>/100<br>Prior life: $pastName</div>\n\n<<if $disciplines.length > 0>>\n''What has surfaced in you:''\n<<if $stepTier > 0>>\n- <strong>Hollow Step</strong> (tier $stepTier) — attention slides off you; quieter feeding, cleaner exits.\n<</if>>\n<<if $strengthTier > 0>>\n- <strong>Grave Strength</strong> (tier $strengthTier) — inhuman force, bought with violence.\n<</if>>\n<<if $senseTier > 0>>\n- <strong>Wake-Sense</strong> (tier $senseTier) — you feel the shape of a night before it arrives.\n<</if>>\n<<if $voiceTier > 0>>\n- <strong>Still Voice</strong> (tier $voiceTier) — people stop, against their judgment, and listen.\n<</if>>\n<<if $memoryTier > 0>>\n- <strong>Blood Memory</strong> (tier $memoryTier) — blood carries the day it came from, and you can read it.\n<</if>>\n<<if $vigilTier > 0>>\n- <strong>Cold Vigil</strong> (tier $vigilTier) — damage has become weather rather than emergency.\n<</if>>\n<<else>>\nNothing has surfaced in you yet. Whatever you become, it hasn't shown itself.\n<</if>>\n\n''Territory:''\n<<if $midtownClaim >= 2>>\n- Midtown Lights — <strong>yours</strong>. The block knows your footsteps and has decided not to mention them.\n<<elseif $midtownClaim == 1>>\n- Midtown Lights — contested. You've made a claim. Something else has noticed.\n<<else>>\n- Midtown Lights — unclaimed, populated, forgiving. <<if $visitedMidtown>>You know it now.<<else>>Unvisited.<</if>>\n<</if>>\n- The Docks — contested ground, rough prey, hunter rumors. <<if $visitedDocks>>You know it now.<<else>>Unvisited.<</if>>\n- Ashgrove Hollow — held by the Hollow Court. <<if $visitedHollow>>You've walked it.<<else>>Unvisited.<</if>>\n\n''People:''\n<<if $metMira>>- Mira Castellan, bartender, Midtown. Trust: $miraTrust<<else>>- No one in Midtown knows your name yet.<</if>>\n<<if $metKestrel>>- Kestrel, a Kindred loner, the Docks. Standing: $kestrelStanding<</if>>\n<<if $metSable>>- Sable, fledgling, no sire. Standing: $sableStanding<</if>>\n<<if $metVoss>>- Voss, enforcer of the Hollow Court. Court standing: $courtStanding<</if>>\n<<if $metIlse>>- Provost Ilse Corven, who speaks for the Hollow Court.<</if>>\n<<if $metJunie>>- Junie. Your sister. Bond: $junieBond<<else>>- Junie has called you four times.<</if>>\n<<if $okaforAwareness > 0>>- Det. Adaeze Okafor, Major Crimes. Her file on you: $okaforAwareness<</if>>\n\n[[Back to the street.->TheCityHub]]\n[[About this game.->About]]\n\n:: Rest\n<<set $hunger to Math.min(100, $hunger + 10)>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\n<<set $heat to Math.max(0, $heat - 5)>>\nYou find a gap between a boarded storefront and a fire escape and let the hours run out without you in them. Time passes strangely now — not sleep, exactly, more like a held breath that lasts until the sky starts thinking about dawn.\n\nLying low costs you nothing but a little more hunger and a little more patience. Nobody adds your description to a report tonight.\n\n<<include \"SystemCheck\">>\n\n[[Back to the street.->TheCityHub]]\n\n:: MidtownEntry\n<<set $visitedMidtown to true>>\n<<set $hunger to Math.min(100, $hunger + 3)>>\n<<if $midtownClaim >= 2>>\nMidtown Lights is doing what it always does at this hour, except that now it does it around you. You've fed here carefully enough, often enough, that the block has developed a habit of not looking directly at you — bouncers nodding you past, a cab slowing without being waved at. This is what claimed ground feels like from the inside. It feels like being furniture that everyone is slightly afraid of.\n<<else>>\nMidtown Lights is doing what it always does at this hour: bleeding neon onto wet pavement, feeding music out of open bar doors, filling its sidewalks with people who are drunk enough not to notice a stranger's too-quiet footsteps. Easy hunting. Easy witnesses too, if you're careless.\n<</if>>\n\n[[There's a bar on the corner with its lights still on — Mira's.->MidtownBar]]\n[[Walk the alleys behind the bars instead — quieter prey.->MidtownAlleyHunt]]\n<<if $heat >= 30>>\n[[Someone on the corner is talking too loud about something they saw.->MidtownWitnessEvent]]\n<</if>>\n<<if $nightsPassed >= 2 && !$metSable>>\n[[Someone else is hunting this block tonight. You can feel them.->SableFirstMeet]]\n<<elseif $metSable && !$sableResolved && $nightsPassed >= 3>>\n[[Sable is working your block again.->SableConfront]]\n<</if>>\n<<if $nightsPassed >= 3 && $midtownClaim == 0 && $miraTrust >= 3>>\n[[Stand still a moment and consider what it would mean to call this block yours.->MidtownClaimStart]]\n<<elseif $midtownClaim == 1>>\n[[Your claim on this block is being tested.->MidtownClaimContest]]\n<</if>>\n[[Head back to the hub.->TheCityHub]]\n\n:: MidtownBar\n<<if $metMira>>\nMira's behind the bar again, rag in hand, radio low. She looks up when the door chimes and — for a second — she doesn't look afraid, which after everything you've done is its own strange gift.\n\n[[Sit down and talk to her.->MiraTalk]]\n<<if $miraTrust >= 5 && $nightsPassed >= 3>>\n[[She's been wanting to tell you something. Let her.->MiraWarning]]\n<</if>>\n<<if $miraTrust <= -3>>\n[[She's alone later. The hunger notices.->MiraFirstMeet]]\n<<else>>\n[[She mentioned closing up alone tonight. The hunger notices.->MiraFirstMeet]]\n<</if>>\n[[Leave the bar.->MidtownEntry]]\n<<else>>\n<<set $metMira to true>>\nThe bar is nearly empty — a couple of regulars fossilized on their stools, a radio playing something slow. The woman behind the counter is maybe thirty, tired around the eyes in a way that says double shift, wiping the same six inches of counter over and over. Her name tag says MIRA.\n\nShe catches you staring and, instead of looking away, gives you a small, exhausted smile. \"Rough night?\"\n\n<<if $past == \"cook\">>\nYou know this bar. You've sat at the end of it after close more times than you can count, still smelling like the fryer, and she has poured you exactly one drink and left you alone with it exactly the way you needed. She doesn't recognize you. You're not sure what that means yet.\n<<else>>\nYou have no idea how to answer that honestly.\n<</if>>\n\n[[Sit down and talk to her.->MiraTalk]]\n[[Say nothing. Wait for her to be alone. The hunger is patient tonight.->MiraFirstMeet]]\n[[Leave the bar.->MidtownEntry]]\n<</if>>\n\n:: MiraTalk\n<<if $miraTrust < 8>>\n<<set $miraTrust to $miraTrust + 2>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\nYou order something you have no intention of drinking and let her talk — about the regulars, about the landlord, about a sister in Ohio she hasn't called back. It costs you nothing but time, and it does something you don't expect: it makes you feel, for the length of the conversation, like a person having a conversation, instead of a hunger wearing one.\n\nShe tells you her last name is Castellan, like it's a joke she's tired of. She doesn't know what you are. She just knows you listen. That's rarer than she thinks.\n<<else>>\nYou sit at the end of the bar and she talks and you listen, and it's good, and it is also — you notice this and dislike noticing it — a thing you have started doing on purpose, the way you'd maintain a tool.\n\nMira has told you everything there is to tell about the landlord and the regulars and the sister in Ohio. There's nothing left here to build. What's between you now either holds under weight or it doesn't, and sitting on this stool for another hour won't settle which.\n<</if>>\n\n<<include \"SystemCheck\">>\n\n<<if $miraTrust < 8>>\n[[Stay a while longer.->MidtownBar]]\n<</if>>\n[[Head back to the hub.->TheCityHub]]\n\n:: MiraWarning\n<<set $miraTrust to $miraTrust + 1>>\n<<set $okaforAwareness to $okaforAwareness + 1>>\nShe waits until the last regular is out the door, then leans on the counter with both forearms, the way people do when they've been rehearsing something for a week.\n\n\"A cop came in,\" she says. \"Woman, Major Crimes, showed me a — not a photo. A drawing. Composite. Asked if anybody's been coming in regular who doesn't drink.\" Mira looks at you steadily. \"I said no.\"\n\nThe radio fills the silence badly.\n\n\"I'm not asking,\" she says. \"I want to be really clear that I'm not asking. I just want you to know I didn't answer her, and I'd like to keep not answering her, and I need you to not make that a stupid decision on my part.\"\n\n<<if $memoryTier > 0>>\nYou can taste her fear from three feet away, and underneath it — this is the part that undoes you — something protective. She's frightened <em>for</em> you, and she can't articulate why, and she's doing it anyway.\n<</if>>\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> A mortal has chosen, without information, to shield you.<br>The System has no field for this. Recording it anyway.</div>\n\n<<include \"SystemCheck\">>\n\n[[Tell her the truth. All of it.->MiraTruth]]\n[[Tell her to stop protecting you and mean it.->MiraPushAway]]\n[[Say nothing useful. Let her keep guessing.->MidtownBar]]\n\n:: MiraTruth\n<<set $miraTrust to $miraTrust + 4>>\n<<set $humanity to Math.min(100, $humanity + 5)>>\n<<set $talkedDown to $talkedDown + 1>>\nYou tell her. Not cleanly — there's no clean version — but you tell her what happened in the alley and what you've been doing since and what you have already done to people in this neighbourhood, and you do not soften the parts that make you the monster in the story.\n\nMira listens with her jaw set and her hands flat on the bar. When you finish she is quiet for a long thirty seconds.\n\n\"Okay,\" she says. Then: \"Okay.\" Then, after a moment: \"You could have lied. You've had a month of chances to lie to me and you took none of them, and I'm choosing to think that means something.\"\n\nShe pushes a glass of water across the bar at you, which is the single most human gesture anyone has made toward you since you died, and neither of you mentions that you can't drink it.\n\n<<include \"SystemCheck\">>\n\n[[Stay until close.->MidtownBar]]\n[[Leave before you cost her anything else.->TheCityHub]]\n\n:: MiraPushAway\n<<set $miraTrust to Math.max(-6, $miraTrust - 3)>>\n<<set $humanity to Math.max(0, $humanity - 2)>>\n\"Answer her,\" you say. \"Next time she comes in, answer everything. Describe me accurately. Don't leave anything out.\"\n\nMira's face does something complicated. \"That's not—\"\n\n\"It's not a favour to me,\" you say, and you make yourself hold her eyes while you say it. \"Whatever you think you're protecting, it isn't worth the thing it's going to cost you.\"\n\nYou leave before she can build an argument. It's the kindest thing you've done all week and it feels identical to cruelty from the inside, and you spend the walk to the corner trying and failing to find the difference.\n\n<<include \"SystemCheck\">>\n\n[[Keep walking.->TheCityHub]]\n\n:: MiraFirstMeet\nClosing time comes, the regulars stagger out, and Mira locks the door behind the last of them, alone now, counting the register down under a buzzing light. You could be inside before she even registers the sound of the lock failing to catch.\n\nThe hunger wants this one badly — you've been near her long enough that she smells like something closer to comfort than prey, which is its own kind of warning.\n\n<<if $miraTrust >= 3>>\nThere's a version of this where you never do this to her at all.\n[[Feed carefully — she wakes up tired and a little dizzy, nothing more.->MiraFeedCareful]]\n[[Feed hard — you need this more than you need her trust.->MiraFeedReckless]]\n[[Walk away. Not her. Not tonight.->MiraDeclineFeed]]\n<<else>>\n[[Feed carefully — controlled, quiet, she won't remember details.->MiraFeedCareful]]\n[[Feed hard and fast — the hunger's louder than your restraint tonight.->MiraFeedReckless]]\n[[Walk away.->MiraDeclineFeed]]\n<</if>>\n\n:: MiraFeedCareful\n<<set $hunger to Math.max(0, $hunger - 28)>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\n<<set $heat to Math.min(100, $heat + 2)>>\n<<if $midtownClaim >= 2>><<set $heat to Math.max(0, $heat - 1)>><</if>>\n<<set $carefulStreak to $carefulStreak + 1>>\n<<set $recklessCount to 0>>\n<<set $miraTrust to $miraTrust + 3>>\n<<set $feedsCareful to $feedsCareful + 1>>\nYou're behind her before the register drawer closes, one hand steadying her shoulder, gentle enough that it could almost be mistaken for a touch a friend would give. You take slow, careful pulls and let her down into her chair before her knees do it for her.\n\nShe'll wake up in twenty minutes, disoriented, blaming low blood sugar and a double shift, and lock up like always. Some part of her — you can't explain how you know this — will keep half-trusting the quiet stranger who tips well and listens. That matters more than it should.\n\n<<include \"SystemCheck\">>\n\n[[Slip out into the night.->TheCityHub]]\n\n:: MiraFeedReckless\n<<set $hunger to Math.max(0, $hunger - 48)>>\n<<set $humanity to Math.max(0, $humanity - 10)>>\n<<set $heat to Math.min(100, $heat + 18)>>\n<<set $recklessCount to $recklessCount + 1>>\n<<set $carefulStreak to 0>>\n<<set $miraTrust to $miraTrust - 6>>\n<<set $feedsReckless to $feedsReckless + 1>>\nYou don't ease into it. She makes one short, cut-off sound before you have her, and by the time the hunger loosens its grip enough to let you think again, she's on the floor behind the bar, breathing but barely, and there's a spray of red across the till she'll have to explain to someone.\n\nShe survives. She will also never again feel safe in a room with a quiet stranger who tips well, and somewhere under the roar of your own satisfaction, you understand exactly what you just spent to fill this hunger up.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> A name has entered someone's memory as a threat.<br>Reputation accrues even when no one knows your face.</div>\n\n<<include \"SystemCheck\">>\n\n[[Get out before someone comes looking for the noise.->TheCityHub]]\n\n:: MiraDeclineFeed\n<<set $hunger to Math.min(100, $hunger + 4)>>\n<<set $humanity to Math.min(100, $humanity + 3)>>\n<<set $miraTrust to $miraTrust + 1>>\n<<set $feedsDeclined to $feedsDeclined + 1>>\nYou watch her lock the register, hum along badly to the radio, flip the sign to CLOSED — and you turn around and walk back out into the street with the hunger gnawing, unfed, unresolved. It's not nothing, choosing this. It doesn't fill you up. It doesn't have to, to matter.\n\n<<include \"SystemCheck\">>\n\n[[Head back to the hub.->TheCityHub]]\n\n:: MidtownClaimStart\n<<set $midtownClaim to 1>>\n<<set $heat to Math.min(100, $heat + 4)>>\nYou stop under the awning outside Mira's and actually look at the block — not for prey, for the first time, but as a shape. Four bars, two late kitchens, a parking structure, an alley system you now know better than the people who take out its trash. You've been careful here. People half-know you here. That is not nothing; that is the raw material of a claim.\n\nYou don't announce it. There's nobody to announce it to. You just start walking the perimeter like it's yours, and something in the way you carry yourself changes enough that a bouncer three doors down straightens up as you pass and doesn't know why he did.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Territorial claim initiated: <strong>Midtown Lights</strong> — contested.<br>Claims are not granted. They are noticed, and then they are tested.</div>\n\n<<include \"SystemCheck\">>\n\n[[Walk the perimeter.->MidtownEntry]]\n\n:: MidtownClaimContest\nThe test comes the way Kestrel would have told you it would, if you'd asked: not as a challenge but as an encroachment. Somebody has fed on your block, sloppily, twice in three nights, and left the kind of mess that brings uniforms and questions to a neighbourhood you have spent a week keeping quiet.\n\n<<if $metSable>>\nYou know exactly who. There's only one other new thing hunting Midtown, and it isn't subtle.\n<<else>>\nYou don't know who yet. You know the shape of them: fast, hungry, careless in a way you recognize from your own first night.\n<</if>>\n\n<<include \"SystemCheck\">>\n\n[[Hold the block. Clean up after them and make the claim stick the slow way.->MidtownClaimHold]]\n[[Hold the block the fast way. Find them and make it unmistakable.->MidtownClaimForce]]\n[[Let it go. A claim isn't worth what holding it costs.->MidtownClaimAbandon]]\n\n:: MidtownClaimHold\n<<set $midtownClaim to 2>>\n<<set $heat to Math.max(0, $heat - 8)>>\n<<set $humanity to Math.min(100, $humanity + 2)>>\n<<set $carefulStreak to $carefulStreak + 1>>\nYou spend three nights being a janitor instead of a predator. You find the woman they left in the stairwell and you call it in from a payphone that shouldn't still exist. You steer a stumbling witness two blocks the wrong way. You feed so carefully during those nights that the hunger becomes a permanent low note you simply learn to live under.\n\nIt works. Not dramatically — that's the point. The block gets quiet again, the patrol car stops idling on the corner, and the neighbourhood settles back into a rhythm that now has you in it.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Territory claimed: <strong>Midtown Lights</strong>.<br>Feeding here now draws less attention. Attention drawn elsewhere still finds its way home.</div>\n\n<<include \"SystemCheck\">>\n\n[[This is yours now.->MidtownEntry]]\n\n:: MidtownClaimForce\n<<set $midtownClaim to 2>>\n<<set $heat to Math.min(100, $heat + 12)>>\n<<set $humanity to Math.max(0, $humanity - 6)>>\n<<set $recklessCount to $recklessCount + 1>>\n<<set $scars to $scars + 1>>\nYou find them on the fire escape behind the Vietnamese place at four in the morning, and you do not open with a conversation. It's brief and it's ugly and you put them through a railing that was structurally more honest than they were.\n\nThey go. The block is unmistakably yours by dawn. It is also, by dawn, a block where two separate people have now called in a disturbance involving figures on a roof, and the patrol car on the corner has become a patrol car that parks there on purpose.\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Territory claimed: <strong>Midtown Lights</strong>.<br>Method logged. Territory holds. Notoriety holds too.</div>\n\n<<include \"SystemCheck\">>\n\n[[This is yours now.->MidtownEntry]]\n\n:: MidtownClaimAbandon\n<<set $midtownClaim to 0>>\n<<set $heat to Math.max(0, $heat - 4)>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\nYou think about what holding this block actually requires — the patrols, the cleanup, the willingness to hurt whoever tests it next, and the certainty that someone will always test it next — and you decide that the version of you that wants a territory is a version you're not obligated to become yet.\n\nYou let the claim go. The block does not notice. Blocks never do.\n\n<<include \"SystemCheck\">>\n\n[[Back to the street.->MidtownEntry]]\n\n:: MidtownAlleyHunt\nThe alleys behind the strip run parallel to the noise, dark enough that nobody looks twice at another shape in the shadows. Two heartbeats present themselves within a block of each other: a reveler peeling off from a bachelorette party, swaying and singing to herself, and a stockroom worker finishing a late shift, keys already out, walking fast toward a car with a child seat visible in the back.\n\n<<include \"SystemCheck\">>\n\n[[Follow the drunk reveler — an easier, lower-stakes target.->HuntDrunkReveler]]\n[[Follow the late-shift worker — more blood, more to lose.->HuntLateShiftWorker]]\n[[Neither. Head back to the hub.->TheCityHub]]\n\n:: HuntDrunkReveler\nShe's easy to catch up to, easy to steer into a doorway on the pretext of helping her stand. Her friends have already turned the corner. Her phone lock screen is a photo of a dog, and her name — you get this off a bar tab still crumpled in her fist — is Cass.\n\nShe's so far gone she barely registers what's happening, laughing softly even as your teeth find her throat, like this is just one more strange thing that happened to her tonight that she won't clearly remember tomorrow.\n\n[[Take a careful pull and set her down safely.->AlleyRevelerCareful]]\n[[Take more than you should. She's drunk — she won't remember the details anyway.->AlleyRevelerReckless]]\n\n:: AlleyRevelerCareful\n<<set $hunger to Math.max(0, $hunger - 24)>>\n<<set $humanity to Math.min(100, $humanity + 2)>>\n<<set $heat to Math.min(100, $heat + 2)>>\n<<if $midtownClaim >= 2>><<set $heat to Math.max(0, $heat - 1)>><</if>>\n<<set $carefulStreak to $carefulStreak + 1>>\n<<set $recklessCount to 0>>\n<<set $feedsCareful to $feedsCareful + 1>>\nYou take just enough, prop Cass against the doorway with her purse still on her shoulder, and text her friends from her own phone before you go: <em>outside, come get me</em>. By the time you're gone she's already forgetting why she sat down. Tomorrow this is a blackout story she tells badly at brunch, not a police report.\n\n<<include \"SystemCheck\">>\n\n[[Head back to the hub.->TheCityHub]]\n\n:: AlleyRevelerReckless\n<<set $hunger to Math.max(0, $hunger - 40)>>\n<<set $humanity to Math.max(0, $humanity - 6)>>\n<<set $heat to Math.min(100, $heat + 10)>>\n<<set $recklessCount to $recklessCount + 1>>\n<<set $carefulStreak to 0>>\n<<set $feedsReckless to $feedsReckless + 1>>\nYou let yourself have more than you need, reasoning — while some quieter part of you keeps count of the reasoning — that no one will believe Cass's account of the night even if she remembers it. She's pale and shaking when you leave her sitting against the doorway, and a passerby is already crouching next to her before you've made it to the end of the block.\n\n<<include \"SystemCheck\">>\n\n[[Get clear of the block.->TheCityHub]]\n\n:: HuntLateShiftWorker\nHe's got his keys laced through his fingers already, the small defensive habit of someone who's read the pamphlets about parking lots at night, and he clocks you approaching a half-second before you're on him — fast enough to almost matter, not fast enough to matter at all. His lanyard says RUBEN O.\n\nThere's a photo on his keychain. A kid, maybe six, gap-toothed, grinning at whoever held the camera.\n\n<<if $past == \"nurse\">>\nYou have discharged this man four hundred times. Different face, same lanyard, same second job, same kid on the same keychain, sitting in your waiting room at 2 a.m. with something that could have been treated a week ago.\n<</if>>\n\n<<include \"SystemCheck\">>\n\n[[Feed carefully. Take only what won't be missed, and let him drive home confused but fine.->WorkerFeedCareful]]\n[[Feed hard. You need this more than you need his night to go well.->WorkerFeedReckless]]\n[[The photo stops you. Walk away.->WorkerDecline]]\n\n:: WorkerFeedCareful\n<<set $hunger to Math.max(0, $hunger - 30)>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\n<<set $heat to Math.min(100, $heat + 3)>>\n<<if $midtownClaim >= 2>><<set $heat to Math.max(0, $heat - 2)>><</if>>\n<<set $carefulStreak to $carefulStreak + 1>>\n<<set $recklessCount to 0>>\n<<set $feedsCareful to $feedsCareful + 1>>\nYou make yourself slow down, make yourself stop while his hands are still steady enough to find his keys again. Ruben sits in his car for ten minutes afterward, forehead on the wheel, chalking the dizziness up to exhaustion, and then he drives home to the kid in the photo, alive and unaware of how close a thing tonight actually was.\n\n<<include \"SystemCheck\">>\n\n[[Head back to the hub.->TheCityHub]]\n\n:: WorkerFeedReckless\n<<set $hunger to Math.max(0, $hunger - 50)>>\n<<set $humanity to Math.max(0, $humanity - 14)>>\n<<set $heat to Math.min(100, $heat + 16)>>\n<<set $recklessCount to $recklessCount + 1>>\n<<set $carefulStreak to 0>>\n<<set $feedsReckless to $feedsReckless + 1>>\nYou don't stop at what you need. You stop when your body decides it's had enough, and by then Ruben is unconscious in the driver's seat, breathing but far too slow, and the photo on his keychain is somehow the only thing in the entire scene you can't stop looking at.\n\nYou leave him there. You tell yourself he'll be found. You don't stay to check.\n\n<<include \"SystemCheck\">>\n\n[[Get away from the lot.->TheCityHub]]\n\n:: WorkerDecline\n<<set $hunger to Math.min(100, $hunger + 3)>>\n<<set $humanity to Math.min(100, $humanity + 4)>>\n<<set $feedsDeclined to $feedsDeclined + 1>>\nYou let him go. Ruben drives off none the wiser, and you stand alone in the lot with the hunger complaining loudly about a meal you chose not to have, for reasons the System has no field to record.\n\n<<include \"SystemCheck\">>\n\n[[Head back to the hub.->TheCityHub]]\n\n:: MidtownWitnessEvent\n<<set $heat to Math.min(100, $heat + 8)>>\n<<set $okaforAwareness to $okaforAwareness + 1>>\nSomeone on the street corner is on their phone, voice pitched high and scared, describing \"a person, I don't know, they moved wrong\" to whoever's on the other end. They're not looking at you. Not yet. But the description isn't wrong, and it isn't going nowhere.\n\n<<if $voiceTier > 0>>\nYou could stop this. You've got the voice for it now — a few words, low and level, and this person would forget why they were frightened.\n[[Use it. Talk them down off their own fear.->WitnessTalkDown]]\n<</if>>\n\n<<include \"SystemCheck\">>\n\n[[Get off the street before they look up.->TheCityHub]]\n\n:: WitnessTalkDown\n<<set $heat to Math.max(0, $heat - 10)>>\n<<set $talkedDown to $talkedDown + 1>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\nYou step into their line of sight, slowly, hands visible, and say something so aggressively ordinary about the weather that their whole nervous system stalls trying to reconcile it. Then you keep talking. Nothing hypnotic, nothing forced — just a steady, boring, human voice, holding steady long enough that the fear has nowhere to stand.\n\nBy the end of it they're apologizing to the operator. Long night. Thought they saw something. Never mind.\n\n<<include \"SystemCheck\">>\n\n[[Walk away while it's still true.->TheCityHub]]\n\n:: DocksEntry\n<<set $visitedDocks to true>>\n<<set $hunger to Math.min(100, $hunger + 3)>>\nThe Docks are quieter than Midtown in a way that feels less like peace and more like held breath. Shipping containers stacked in canyons, sodium lights half of them dead, water slapping against pilings somewhere out of sight. This ground isn't unclaimed like Midtown — you can feel that much even without knowing why, a kind of territorial static in the air.\n\n<<if $metKestrel>>\nA shape you now recognize is sitting on a container rail up ahead, unmoving, watching the water. Kestrel.\n[[Go talk to Kestrel.->DocksKestrelMeet]]\n<<else>>\nSomeone is sitting very still on a container rail up ahead, watching the black water like it owes them money.\n[[Approach the still figure.->DocksKestrelMeet]]\n<</if>>\n[[Hunt among the dockworkers and night-shift crews instead.->DocksHunt]]\n<<if $heat >= 35>>\n[[Something's wrong here tonight — the air feels watched.->DocksHunterSign]]\n<</if>>\n<<if $okaforMet && $okaforAwareness >= 3 && $nightsPassed >= 3>>\n[[The unmarked sedan is back. This time she's alone, and she's waiting for you.->OkaforInterview]]\n<</if>>\n[[Head back to the hub.->TheCityHub]]\n\n:: DocksKestrelMeet\n<<if $metKestrel>>\nKestrel hasn't moved from the rail. You're starting to suspect they don't, much.\n<<else>>\n<<set $metKestrel to true>>\nUp close, Kestrel doesn't look dangerous so much as tired in a way that's lasted centuries, not years — sunken eyes, an old coat, hands folded like they're used to waiting. They don't turn to look at you, but they speak anyway, like they clocked you the moment you crossed into the Docks.\n\n\"New,\" they say. Not a question. \"No sire worth the name, or you wouldn't be wandering around out here broadcasting like a lighthouse. What do you want, fledgling?\"\n<</if>>\n\n[[Ask them what you are — really ask.->KestrelAskHelp]]\n[[Demand answers. You're done being confused.->KestrelThreaten]]\n[[Say nothing. Just listen.->KestrelListen]]\n<<if $kestrelStanding >= 3 && $nightsPassed >= 2>>\n[[Ask them to actually teach you something.->KestrelLesson2]]\n<</if>>\n<<if $kestrelStanding >= 6 && $nightsPassed >= 4>>\n[[Ask them the question you've been circling all week.->KestrelLesson3]]\n<</if>>\n[[Leave them to the water.->DocksEntry]]\n\n:: KestrelAskHelp\n<<if $kestrelStanding < 6>>\n<<set $kestrelStanding to $kestrelStanding + 1>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\n<</if>>\n\"What am I,\" you say, and it comes out smaller than you meant it to.\n\nKestrel almost smiles. \"Hungry. Dangerous. Unclaimed, which around here is the same thing as unprotected. Beyond that — depends what you do next. The System you're carrying isn't wisdom, it's just bookkeeping. It'll tell you what happened. It won't tell you what to be.\" They finally look at you. \"That part's still yours. For now.\"\n\n<<include \"SystemCheck\">>\n\n<<if $kestrelStanding < 6>>\n[[Ask what \"for now\" means.->DocksKestrelMeet]]\n<</if>>\n[[Thank them and step back.->DocksEntry]]\n\n:: KestrelThreaten\n<<set $kestrelStanding to $kestrelStanding - 3>>\n<<set $heat to Math.min(100, $heat + 4)>>\nYou take a step closer, some new and ugly confidence telling you that whatever you are now, you're strong enough to make demands of an old thing sitting alone on a dock at night.\n\nKestrel doesn't flinch, doesn't rise, just finally turns their head enough that you feel — physically feel, like a hand closing slow around your throat from the inside — exactly how much stronger they are than you. \"Careful,\" is all they say. The pressure lifts as suddenly as it came. \"I don't answer to threats from things that haven't survived a week yet. Ask nicely next time, or don't ask at all.\"\n\n<<include \"SystemCheck\">>\n\n[[Back off.->DocksEntry]]\n\n:: KestrelListen\n<<if $kestrelStanding < 6>>\n<<set $kestrelStanding to $kestrelStanding + 2>>\nYou say nothing. You just stay, and listen, and let the silence stretch long enough that Kestrel eventually fills it on their own terms instead of yours — which, you're beginning to understand, is the only way anyone this old ever really tells you anything.\n\n\"Feed like you have a choice, every time, even the times you don't,\" they say, eyes back on the water. \"That's the whole discipline, before it's a power. Everyone who lasts learns that part first. Everyone who doesn't, doesn't.\"\n<<else>>\nYou sit and you listen, and Kestrel lets the silence run, and this time they don't fill it.\n\n\"You've got the trick of this now,\" they say eventually, without turning. \"Sitting quiet with an old thing until it talks. It works. It has worked on me, repeatedly, and I've let it.\" A long pause, water on pilings. \"But you're not going to get anything further out of me by waiting, fledgling. Past a point, listening stops being how you learn and starts being how you avoid deciding. Go and do something I can have an opinion about.\"\n<</if>>\n\n<<include \"SystemCheck\">>\n\n<<if $kestrelStanding < 6>>\n[[Sit with that a while longer.->DocksKestrelMeet]]\n<</if>>\n[[Head back into the Docks.->DocksEntry]]\n\n:: KestrelLesson2\n<<set $kestrelStanding to $kestrelStanding + 2>>\n<<set $humanity to Math.min(100, $humanity + 2)>>\n\"Teach me something,\" you say. \"Not a warning. Something I can use.\"\n\nKestrel is quiet long enough that you think they've decided not to. Then they slide off the rail — the first time you've seen them move — and walk you three containers down to where a night crew is loading, and they make you stand there and just watch.\n\n\"Count them,\" they say.\n\nSix workers. You count six.\n\n\"Count again.\"\n\nEight. There's a man on a break behind the forklift and a woman up in the cab you'd both filed as scenery. Kestrel lets that land.\n\n\"Your hunger edits the world down to what it can eat,\" they say. \"Everything else goes grey. That's not a moral failing, it's an optical one, and it is exactly how your kind gets caught — you stop seeing the two people who aren't food and one of them has a phone.\" They start back toward the rail. \"Learn to count twice. It's the only lesson I've got that's ever kept anybody alive.\"\n\n<<include \"SystemCheck\">>\n\n[[Count twice from now on.->DocksKestrelMeet]]\n\n:: KestrelLesson3\n<<set $kestrelStanding to $kestrelStanding + 3>>\n<<set $humanity to Math.min(100, $humanity + 2)>>\n\"Why are you helping me,\" you say. \"You don't do this. I've asked around enough to know you don't do this.\"\n\nKestrel looks at you for a long moment, and for the first time since you met them, something in their face is unguarded.\n\n\"I had a childe,\" they say. \"Once. I taught her nothing, because nobody taught me anything, and I had decided that was how it was done.\" A pause the length of a held breath. \"She lasted eleven months. The Court took her apart in a basement in Ashgrove over a territorial question that a competent sire would have settled with one conversation.\"\n\nThe water goes on slapping the pilings.\n\n\"You're not her,\" they say. \"You're not a replacement for her, and I'd thank you not to try to be. But you turned up unclaimed and broadcasting, and I found that I could not do nothing twice.\"\n\n<div class=\"sys-pulse\"><strong>[ SYSTEM ]</strong> Relationship threshold: <strong>KESTREL</strong>.<br>An unclaimed fledgling now has something functionally indistinguishable from a sire.</div>\n\n<<include \"SystemCheck\">>\n\n[[Say the only true thing you can think of: thank you.->DocksKestrelMeet]]\n\n:: DocksHunt\nDockworkers finishing overnight loads, a couple of figures who look like they're moving something nobody filed paperwork for, a security guard doing rounds with a flashlight and no real conviction — the Docks offer rougher prey than Midtown, people less likely to be believed if they report something, but also less predictable, some of them armed, all of them used to watching their backs.\n\n<<if $past == \"guard\">>\nYou know the guard's route before he walks it. You <em>wrote</em> a route like that, once, for a warehouse two piers over: clockwise, four stops, sign the sheet at each one, and the long blind stretch between stops two and three where nobody has ever once been fired for taking a phone break.\n<</if>>\n\n<<include \"SystemCheck\">>\n\n[[Take the security guard — isolated, routine, easy to time.->DocksHuntCareful]]\n[[Take one of the smugglers — nobody's calling the police about this one.->DocksHuntReckless]]\n[[Not tonight. Head back.->DocksEntry]]\n\n:: DocksHuntCareful\n<<set $hunger to Math.max(0, $hunger - 27)>>\n<<set $humanity to Math.min(100, $humanity + 1)>>\n<<set $heat to Math.min(100, $heat + 3)>>\n<<set $carefulStreak to $carefulStreak + 1>>\n<<set $recklessCount to 0>>\n<<set $feedsCareful to $feedsCareful + 1>>\nYou time his second lap, catch him in the gap between two containers where the cameras don't reach, and take exactly what the hunger needs and not one pull more. His radio crackles once while you're doing it and you wait, patient, for dispatch to lose interest.\n\nAmos clocks out at the end of his shift with a headache he blames on the energy drinks, and no one ever asks him a single question about it.\n\n<<include \"SystemCheck\">>\n\n[[Head back to the hub.->TheCityHub]]\n\n:: DocksHuntReckless\n<<set $hunger to Math.max(0, $hunger - 42)>>\n<<set $humanity to Math.max(0, $humanity - 7)>>\n<<set $heat to Math.min(100, $heat + 12)>>\n<<set $okaforAwareness to $okaforAwareness + 1>>\n<<set $recklessCount to $recklessCount + 1>>\n<<set $carefulStreak to 0>>\n<<set $feedsReckless to $feedsReckless + 1>>\nYou reason, going in, that a smuggler is nobody's idea of a sympathetic victim. You don't reason your way back out again until Pike is on the ground and his two associates are already shouting into radios about \"the thing\" that just took their friend apart.\n\nNobody official comes for this. Something worse might: this crew has its own reasons not to want unexplained bodies drawing attention to their shipments, and now they have a reason to go looking for you specifically.\n\n<<include \"SystemCheck\">>\n\n[[Get out before the shouting brings more of them.->TheCityHub]]\n\n:: DocksHunterSign\n<<set $okaforAwareness to $okaforAwareness + 1>>\nChalk marks on a container that aren't graffiti. A parked sedan with two people inside who haven't gotten out in twenty minutes, engine running for the heat, not the drive. A card, half-soaked, wedged under a pallet: DET. A. OKAFOR, MAJOR CRIMES, with a case number scrawled on the back in pen.\n\nSomebody official is already asking questions about \"the bloodless ones\" — and the Docks,
