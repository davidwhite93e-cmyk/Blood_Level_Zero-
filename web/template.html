<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood Level Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0908;
    --panel:#141210;
    --panel-2:#1b1815;
    --rule:#332723;
    --blood-deep:#5c141f;
    --blood:#9c2233;
    --blood-bright:#c93a4c;
    --system:#8fa39c;
    --system-dim:#5d6d68;
    --bone:#ddd3c4;
    --bone-dim:#9a9086;
    --muted:#6b6259;
    --warn:#c9963a;
    font-size:16px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--bone);
    font-family:'Spectral',Georgia,'Times New Roman',serif;
    font-size:1.05rem;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  @keyframes grain-shift{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-2%,-3%); }
    40%{ transform:translate(-4%,2%); }
    60%{ transform:translate(2%,-2%); }
    80%{ transform:translate(3%,3%); }
  }
  body::before{
    content:"";
    position:fixed; inset:-10%;
    pointer-events:none;
    z-index:1;
    opacity:.05;
    mix-blend-mode:overlay;
    background-image:
      radial-gradient(circle at 20% 30%, #fff 0, transparent 40%),
      radial-gradient(circle at 80% 10%, #fff 0, transparent 35%),
      radial-gradient(circle at 60% 80%, #fff 0, transparent 45%),
      radial-gradient(circle at 10% 90%, #fff 0, transparent 30%);
    background-size:180% 180%;
    animation:grain-shift 9s steps(8) infinite;
  }
  @media (prefers-reduced-motion:reduce){
    body::before{ animation:none; }
  }

  #app{
    position:relative; z-index:2;
    max-width:680px;
    margin:0 auto;
    padding:0 22px 96px;
  }

  /* ---- Masthead ---- */
  .masthead{
    padding:26px 0 14px;
    border-bottom:1px solid var(--rule);
    margin-bottom:0;
  }
  .wordmark{
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--system);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .wordmark .title{ color:var(--bone-dim); }
  .wordmark .dot{ color:var(--blood-bright); }
  .wordmark .night{
    color:var(--muted);
    font-size:.68rem;
    letter-spacing:.14em;
    margin-left:10px;
  }
  .mast-right{ display:flex; align-items:center; gap:8px; }
  .restart-link{
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    letter-spacing:.1em;
    color:var(--muted);
    text-decoration:none;
    text-transform:uppercase;
    border:1px solid var(--rule);
    padding:3px 8px;
    cursor:pointer;
    background:transparent;
    transition:border-color .15s ease, color .15s ease;
  }
  .restart-link:hover{ color:var(--blood-bright); border-color:var(--blood-deep); }
  .restart-link:focus-visible{ outline:2px solid var(--system); outline-offset:2px; }

  /* ---- Status strip ---- */
  .status{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    padding:14px 0 18px;
    border-bottom:1px solid var(--rule);
    margin-bottom:22px;
  }
  .gauge{ display:flex; flex-direction:column; gap:5px; }
  .gauge-label{
    font-family:'JetBrains Mono',monospace;
    font-size:.62rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }
  .gauge-label .val{
    color:var(--bone-dim);
    font-variant-numeric:tabular-nums;
  }
  .ticks{
    display:flex;
    gap:2px;
    height:8px;
  }
  .ticks span{
    flex:1 1 0;
    background:var(--panel-2);
    border-top:1px solid var(--rule);
  }
  .ticks span.on{ background:var(--fill,var(--system)); border-top-color:var(--fill,var(--system)); }
  .gauge.hunger .ticks span.on{ --fill:var(--warn); }
  .gauge.humanity .ticks span.on{ --fill:var(--system); }
  .gauge.heat .ticks span.on{ --fill:var(--blood-bright); }
  .gauge.critical .gauge-label .val{ color:var(--blood-bright); }

  .disciplines-row{
    font-family:'JetBrains Mono',monospace;
    font-size:.66rem;
    letter-spacing:.08em;
    color:var(--system-dim);
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:-6px 0 22px;
    min-height:1em;
  }
  .disciplines-row .tag{
    border:1px solid var(--rule);
    padding:2px 7px;
    color:var(--system);
    text-transform:uppercase;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .disciplines-row .tag .pips{
    color:var(--blood-bright);
    letter-spacing:.12em;
    font-size:.6rem;
  }
  .disciplines-row .tag .pips .off{ color:var(--rule); }

  /* ---- Passage text ---- */
  #passage{ min-height:40vh; }
  #passage p{
    margin:0 0 1.15em;
    color:var(--bone);
  }
  #passage p:first-of-type::first-letter{
    color:var(--blood-bright);
  }
  #passage strong{ color:var(--bone); font-weight:600; }
  #passage em{ color:var(--bone-dim); }

  .sys-pulse{
    font-family:'JetBrains Mono',monospace;
    font-size:.82rem;
    line-height:1.6;
    color:var(--system);
    background:var(--panel);
    border:1px solid var(--rule);
    border-left:3px solid var(--blood);
    padding:12px 14px;
    margin:20px 0;
    letter-spacing:.01em;
    animation:pulse-in .35s ease both;
  }
  .sys-pulse strong{ color:var(--blood-bright); font-weight:700; }
  @keyframes pulse-in{
    from{ opacity:0; transform:translateY(-4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion:reduce){
    .sys-pulse{ animation:none; }
  }

  .ending-card{
    font-family:'JetBrains Mono',monospace;
    font-size:.78rem;
    line-height:1.7;
    color:var(--bone-dim);
    background:linear-gradient(180deg, rgba(92,20,31,.14), rgba(10,9,8,.5));
    border:1px solid var(--blood-deep);
    border-left:4px solid var(--blood-bright);
    padding:16px 18px;
    margin:28px 0 8px;
    letter-spacing:.02em;
  }
  .ending-card strong{ color:var(--blood-bright); letter-spacing:.14em; }

  /* ---- Choices ---- */
  #choices{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:26px;
  }
  .choice-row{ display:contents; }
  a.choice-link{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:.86rem;
    letter-spacing:.01em;
    color:var(--bone);
    text-decoration:none;
    background:var(--panel);
    border:1px solid var(--rule);
    padding:11px 14px;
    transition:border-color .15s ease, background .15s ease, color .15s ease, padding-left .15s ease;
  }
  a.choice-link::before{
    content:"›";
    display:inline-block;
    width:1.1em;
    color:var(--blood);
  }
  a.choice-link:hover{
    border-color:var(--blood-deep);
    background:var(--panel-2);
    color:#fff;
    padding-left:18px;
  }
  a.choice-link:hover::before{ color:var(--blood-bright); }
  a.choice-link:focus-visible{ outline:2px solid var(--system); outline-offset:1px; }

  .end-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:8px;
  }
  .end-note{
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;
    letter-spacing:.06em;
    color:var(--muted);
    text-transform:uppercase;
    margin:0 0 4px;
  }

  .resume-panel{
    border:1px solid var(--rule);
    border-left:3px solid var(--system-dim);
    background:var(--panel);
    padding:16px 18px;
    margin:26px 0 0;
  }
  .resume-panel h2{
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--system);
    margin:0 0 8px;
    font-weight:500;
  }
  .resume-panel p{
    font-size:.95rem;
    color:var(--bone-dim);
    margin:0 0 14px;
  }

  footer.notice{
    font-family:'JetBrains Mono',monospace;
    font-size:.62rem;
    color:var(--muted);
    letter-spacing:.04em;
    margin-top:48px;
    padding-top:16px;
    border-top:1px solid var(--rule);
  }

  ::selection{ background:var(--blood-deep); color:#fff; }
</style>

<div id="app">
  <div class="masthead">
    <div class="wordmark">
      <span class="title">Blood Level Zero<span class="dot">.</span><span class="night" id="nightLabel"></span></span>
      <span class="mast-right">
        <button class="restart-link" id="restartBtn" type="button">↺ begin again</button>
      </span>
    </div>
  </div>

  <div class="status" id="statusStrip" aria-hidden="true"></div>
  <div class="disciplines-row" id="disciplinesRow"></div>

  <main id="passage" aria-live="polite"></main>
  <div id="choices"></div>

  <footer class="notice">SYSTEM ONLINE — TRACKING ACTIVE — SIRE: UNKNOWN — progress saves automatically in this browser</footer>
</div>

<script>
/* ==== Blood Level Zero — embedded engine (SugarCube-subset interpreter) ==== */
/*__ENGINE_JS__*/

/* ==== Story source (identical to src/story.twee) ==== */
const TWEE_SOURCE = __TWEE_SOURCE_JSON__;

/* ==== Controller ==== */
(function(){
  var SAVE_KEY = 'blz-save-v1';
  var engine = null;

  var POWERS = [
    { key:'stepTier',     name:'Hollow Step',   max:3 },
    { key:'strengthTier', name:'Grave Strength',max:3 },
    { key:'senseTier',    name:'Wake-Sense',    max:2 },
    { key:'voiceTier',    name:'Still Voice',   max:2 },
    { key:'memoryTier',   name:'Blood Memory',  max:2 },
    { key:'vigilTier',    name:'Cold Vigil',    max:2 }
  ];

  var passageEl  = document.getElementById('passage');
  var choicesEl  = document.getElementById('choices');
  var statusEl   = document.getElementById('statusStrip');
  var discEl     = document.getElementById('disciplinesRow');
  var nightEl    = document.getElementById('nightLabel');
  var restartBtn = document.getElementById('restartBtn');

  /* ---- persistence (best-effort; never let storage break the game) ---- */
  function saveGame(passageName){
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 1,
        passage: passageName,
        state: engine.state
      }));
    } catch (e) { /* private mode, quota, blocked storage — play on */ }
  }
  function loadGame(){
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || data.v !== 1 || !data.passage || !data.state) return null;
      return data;
    } catch (e) { return null; }
  }
  function clearGame(){
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  }

  /* ---- rendering ---- */
  function ticks(value, count){
    var v = Math.max(0, Math.min(100, Number(value) || 0));
    var filled = Math.round((v / 100) * count);
    var html = '';
    for (var i = 0; i < count; i++){
      html += '<span class="' + (i < filled ? 'on' : '') + '"></span>';
    }
    return html;
  }

  function renderStatus(){
    var s = engine.state;
    var gauges = [
      {key:'hunger',   label:'Hunger',    value:s.hunger,   critical: s.hunger >= 85},
      {key:'humanity', label:'Humanity',  value:s.humanity, critical: s.humanity <= 40},
      {key:'heat',     label:'Notoriety', value:s.heat,     critical: s.heat >= 60}
    ];
    statusEl.innerHTML = gauges.map(function(g){
      return '<div class="gauge ' + g.key + (g.critical ? ' critical' : '') + '">' +
        '<div class="gauge-label"><span>' + g.label + '</span><span class="val">' + Math.round(Number(g.value) || 0) + '</span></div>' +
        '<div class="ticks">' + ticks(g.value, 20) + '</div>' +
      '</div>';
    }).join('');

    nightEl.textContent = s.nightsPassed ? ' / night ' + s.nightsPassed : '';

    var tags = POWERS.filter(function(p){ return (Number(s[p.key]) || 0) > 0; }).map(function(p){
      var tier = Number(s[p.key]) || 0;
      var pips = '';
      for (var i = 0; i < p.max; i++){
        pips += i < tier ? '<span>&#9679;</span>' : '<span class="off">&#9679;</span>';
      }
      return '<span class="tag">' + p.name + '<span class="pips">' + pips + '</span></span>';
    });
    discEl.innerHTML = tags.length
      ? tags.join('')
      : '<span style="opacity:.5">no powers surfaced yet</span>';
  }

  function makeChoice(text, target){
    var a = document.createElement('a');
    a.href = '#';
    a.className = 'choice-link';
    a.textContent = text;
    a.dataset.target = target;
    a.addEventListener('click', function(ev){
      ev.preventDefault();
      window.scrollTo({top:0, behavior:'smooth'});
      go(target);
    });
    return a;
  }

  function go(name){
    var result;
    try {
      result = engine.goto(name);
    } catch (e) {
      passageEl.innerHTML = '<p style="color:#c93a4c">A tear in the narrative: ' + (e && e.message ? e.message : e) + '</p>';
      choicesEl.innerHTML = '';
      console.error(e);
      return;
    }

    passageEl.innerHTML = result.html;
    renderStatus();
    choicesEl.innerHTML = '';

    var isEnding = (result.tags || []).indexOf('ending') !== -1;

    if (isEnding) {
      // The run is over — drop the checkpoint so "begin again" is a clean slate.
      clearGame();
      var note = document.createElement('p');
      note.className = 'end-note';
      note.textContent = '— end of run —';
      var actions = document.createElement('div');
      actions.className = 'end-actions';
      var again = document.createElement('a');
      again.href = '#';
      again.className = 'choice-link';
      again.textContent = 'Begin again, from the alley.';
      again.addEventListener('click', function(ev){
        ev.preventDefault();
        window.scrollTo({top:0, behavior:'smooth'});
        startNew();
      });
      actions.appendChild(again);
      choicesEl.appendChild(note);
      choicesEl.appendChild(actions);
      return;
    }

    saveGame(result.passage);

    if (result.choices.length === 0) {
      choicesEl.innerHTML = '<p class="end-note">— no further paths from here —</p>';
      return;
    }

    var row = document.createElement('div');
    row.className = 'choice-row';
    result.choices.forEach(function(c){
      row.appendChild(makeChoice(c.text, c.target));
    });
    choicesEl.appendChild(row);
  }

  function startNew(){
    clearGame();
    engine = BLZCreateEngine(TWEE_SOURCE);
    go(engine.startPassage);
  }

  function resumeFrom(save){
    engine = BLZCreateEngine(TWEE_SOURCE);
    // StoryInit has already seeded defaults; overlay the saved run on top of them
    // so that variables added since the save was written keep their defaults.
    Object.keys(save.state).forEach(function(k){
      engine.state[k] = save.state[k];
    });
    go(save.passage);
  }

  function showResumePrompt(save){
    engine = BLZCreateEngine(TWEE_SOURCE);
    renderStatus();
    passageEl.innerHTML =
      '<div class="resume-panel">' +
        '<h2>[ SYSTEM ] Prior session detected</h2>' +
        '<p>A run is already in progress — night ' + (save.state.nightsPassed || 1) +
        ', humanity ' + Math.round(Number(save.state.humanity) || 0) + '/100. ' +
        'Continue where you left off, or wake up in the alley again?</p>' +
      '</div>';
    choicesEl.innerHTML = '';
    var row = document.createElement('div');
    row.className = 'choice-row';

    var cont = document.createElement('a');
    cont.href = '#';
    cont.className = 'choice-link';
    cont.textContent = 'Continue this run.';
    cont.addEventListener('click', function(ev){ ev.preventDefault(); resumeFrom(save); });

    var fresh = document.createElement('a');
    fresh.href = '#';
    fresh.className = 'choice-link';
    fresh.textContent = 'Start over from the beginning.';
    fresh.addEventListener('click', function(ev){ ev.preventDefault(); startNew(); });

    row.appendChild(cont);
    row.appendChild(fresh);
    choicesEl.appendChild(row);
  }

  restartBtn.addEventListener('click', function(){
    if (window.confirm('Begin the night again from the start? This clears your saved progress.')) {
      startNew();
    }
  });

  var existing = loadGame();
  if (existing) {
    showResumePrompt(existing);
  } else {
    startNew();
  }
})();
</script>
